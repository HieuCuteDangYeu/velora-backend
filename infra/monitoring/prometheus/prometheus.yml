global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: monitoring-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - monitoring-service:3016

  - job_name: conversation-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - conversation-service:3005

  - job_name: call-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - call-service:3007

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: cadvisor
    metrics_path: /metrics
    static_configs:
      - targets:
          - cadvisor:8080
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_service]
        regex: '.+'
        target_label: service
      - source_labels: [name]
        regex: '.+'
        target_label: container
