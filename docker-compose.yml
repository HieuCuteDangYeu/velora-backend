services:
  qdrant:
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    profiles: [qdrant]
    restart: unless-stopped
    cpus: '1.0'
    mem_limit: 768m
    mem_reservation: 256m
    entrypoint: [bash, /qdrant/velora-entrypoint.sh]
    volumes:
      - qdrant_storage:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
      - ./infra/qdrant/config.yaml:/qdrant/config/velora.yaml:ro
      - ./infra/qdrant/entrypoint.sh:/qdrant/velora-entrypoint.sh:ro
      - ./infra/qdrant/ready.sh:/qdrant/velora-ready.sh:ro
    secrets:
      - qdrant_api_key
      - qdrant_tls_cert
      - qdrant_tls_key
      - qdrant_tls_ca
    healthcheck:
      test: [CMD, bash, /qdrant/velora-ready.sh]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - reel-vector-net

  api-gateway:
    image: ${DOCKERHUB_USERNAME}/api-gateway:${VELORA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ./apps/api-gateway/Dockerfile
    restart: always
    expose:
      - '3000'
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - '127.0.0.1:80:80'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    networks:
      - microservices-net

  user-service:
    image: ${DOCKERHUB_USERNAME}/user-service:${VELORA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ./apps/user-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    expose:
      - '3018'
    env_file:
      - .env
    environment:
      # Shared Aiven budget is small; do not use Prisma's CPU-based default.
      USER_DATABASE_CONNECTION_LIMIT: ${USER_DATABASE_CONNECTION_LIMIT:-2}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  auth-service:
    image: ${DOCKERHUB_USERNAME}/auth-service:${VELORA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ./apps/auth-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    expose:
      - '3017'
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  media-service:
    image: ${DOCKERHUB_USERNAME}/media-service:${VELORA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ./apps/media-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  media-processing-service:
    image: ${DOCKERHUB_USERNAME}/media-processing-service:${VELORA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ./apps/media-processing-service/Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      MEDIA_WORKER_LANE: SHORT
      MEDIA_WORKER_PREFETCH: ${MEDIA_WORKER_PREFETCH:-1}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  media-processing-long-service:
    image: ${DOCKERHUB_USERNAME}/media-processing-service:${VELORA_IMAGE_TAG:-latest}
    restart: always
    env_file:
      - .env
    environment:
      MEDIA_WORKER_LANE: LONG
      MEDIA_WORKER_PREFETCH: ${MEDIA_WORKER_PREFETCH:-1}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  reel-indexing-service:
    image: ${DOCKERHUB_USERNAME}/reel-indexing-service:${VELORA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ./apps/reel-indexing-service/Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      INDEX_WORKER_LANE: SHORT
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  reel-indexing-long-service:
    image: ${DOCKERHUB_USERNAME}/reel-indexing-service:${VELORA_IMAGE_TAG:-latest}
    restart: always
    env_file:
      - .env
    environment:
      INDEX_WORKER_LANE: LONG
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  content-service:
    image: ${DOCKERHUB_USERNAME}/content-service:${VELORA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ./apps/content-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  conversation-service:
    image: ${DOCKERHUB_USERNAME}/conversation-service:${VELORA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ./apps/conversation-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    expose:
      - '3005'
    env_file:
      - .env
    environment:
      # Reads that tolerate a few seconds of lag (reaction details) use the Mongo
      # secondary on velora-node-2, with a fallback to the primary. Set the value
      # to empty to keep every read on the primary. See infra/mongo-replica/README.md.
      CONVERSATION_READ_REPLICA_PREFERENCE: secondaryPreferred
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  call-service:
    image: ${DOCKERHUB_USERNAME}/call-service:${VELORA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ./apps/call-service/Dockerfile
    restart: always
    expose:
      - '3007'
    environment:
      NODE_ENV: production
      # Stateless signaling: mediasoup runs on the call-media-* nodes below,
      # so any number of replicas may run behind nginx.
      CALL_MEDIA_MODE: remote
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net
    deploy:
      replicas: 2

  # Media nodes run the call-service image with the media node entrypoint.
  # Each publishes its own UDP port, which must be forwarded on the router to
  # this host (mediasoup announces the port it listens on, so host == container).
  # The home router forwards a single UDP port, so only one node runs here.
  # To add call-media-2, copy this block with MEDIA_NODE_ID=call-media-2 and
  # UDP 40001, forward that port, and list it in CALL_MEDIA_SERVICES and the
  # call-media Prometheus job (see docs/call-runtime-rollout.md).
  call-media-1:
    image: ${DOCKERHUB_USERNAME}/call-service:${VELORA_IMAGE_TAG:-latest}
    restart: always
    command: ['node', 'dist/apps/call-service/apps/call-service/src/media-node/main.js']
    expose:
      - '3019'
      - '4100'
    ports:
      - '40000:40000/udp'
    environment:
      NODE_ENV: production
      MEDIA_NODE_ID: call-media-1
      MEDIASOUP_WEBRTC_SERVER_PORT: '40000'
      MEDIASOUP_WORKERS: '1'
      # The home node is preferred for new calls. Past 20 open rooms (the load
      # held by the 20-call stress run) new calls overflow to a node with a
      # higher priority number, such as call-media-2 on velora-node-2.
      CALL_MEDIA_NODE_PRIORITY: '0'
      CALL_MEDIA_NODE_MAX_ROOMS: '20'
      # Follow the ISP's public IPv4; MEDIASOUP_ANNOUNCED_IP in .env is the fallback.
      MEDIASOUP_ANNOUNCED_IP_MODE: ${MEDIASOUP_ANNOUNCED_IP_MODE:-stun}
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      # Ordering only: during the cutover from the embedded runtime the old
      # call-service container must release UDP 40000 before this node binds it.
      call-service:
        condition: service_started
    networks:
      - microservices-net

  monitoring-service:
    image: ${DOCKERHUB_USERNAME}/monitoring-service:${VELORA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ./apps/monitoring-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    env_file:
      - .env
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      # Loki runs on velora-node-2 (infra/loki-node/); read it over Tailscale.
      LOKI_URL: http://100.86.68.16:3100
      DOCKER_ENGINE_SOCKET: ${DOCKER_ENGINE_SOCKET:-/var/run/docker.sock}
      # Two Prisma clients: one connection each, two total on this instance.
      MONITORING_DATABASE_CONNECTION_LIMIT: ${MONITORING_DATABASE_CONNECTION_LIMIT:-1}
    expose:
      - '3016'
    group_add:
      - '${DOCKER_ENGINE_GID:-0}'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      prometheus:
        condition: service_started
    networks:
      - microservices-net

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    mem_limit: ${PROMETHEUS_MEMORY_LIMIT:-512m}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - '127.0.0.1:9090:9090'
    depends_on:
      - node-exporter
    networks:
      - microservices-net

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    mem_limit: ${NODE_EXPORTER_MEMORY_LIMIT:-64m}
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --no-collector.btrfs
      - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/.+)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
      - ./infra/monitoring/node-exporter-textfile:/var/lib/node_exporter/textfile_collector:ro
    expose:
      - '9100'
    networks:
      - microservices-net

  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    mem_limit: ${ALLOY_MEMORY_LIMIT:-192m}
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./infra/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    networks:
      - microservices-net

  notification-service:
    image: ${DOCKERHUB_USERNAME}/notification-service:${VELORA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ./apps/notification-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    env_file:
      - .env
    environment:
      NOTIFICATION_APNS_REQUEST_TIMEOUT_MS: ${NOTIFICATION_APNS_REQUEST_TIMEOUT_MS:-5000}
      NOTIFICATION_RETRY_POLL_INTERVAL_MS: ${NOTIFICATION_RETRY_POLL_INTERVAL_MS:-3000}
      # Shared PostgreSQL instance has a 20-connection server budget.
      NOTIFICATION_DATABASE_CONNECTION_LIMIT: ${NOTIFICATION_DATABASE_CONNECTION_LIMIT:-4}
    depends_on:
      rabbitmq:
        condition: service_healthy
    expose:
      - '3015'
    volumes:
      - ./apps/notification-service/secrets/firebase-admin.json:/usr/src/app/apps/notification-service/secrets/firebase-admin.json:ro
      - ./apps/notification-service/secrets/apns-private-key.p8:/usr/src/app/apps/notification-service/secrets/apns-private-key.p8:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O - http://127.0.0.1:3015/health >/dev/null || exit 1',
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks:
      - microservices-net

  ai-service:
    image: ${DOCKERHUB_USERNAME}/ai-service:${VELORA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ./apps/ai-service/Dockerfile
    restart: always
    environment:
      LANGFUSE_RELEASE: ${VELORA_IMAGE_TAG:-${LANGFUSE_RELEASE:-unknown}}
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      rag-embedding:
        condition: service_healthy
      rag-reranker:
        condition: service_healthy
    networks:
      - microservices-net

  rag-embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-latest@sha256:7e0ad922d10ef6f728b521d1a47e83004480687bd4073c97f079c806e3e92a41
    env_file:
      - .env
    command:
      - --model-id
      - ${TEI_EMBEDDING_MODEL:-BAAI/bge-m3}
      - --port
      - '80'
      - --max-concurrent-requests
      - ${TEI_EMBEDDING_MAX_CONCURRENT_REQUESTS:-8}
      - --max-batch-tokens
      - ${TEI_EMBEDDING_MAX_BATCH_TOKENS:-1024}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:80/health']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - rag_embedding_cache:/data
    networks:
      - microservices-net

  rag-reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-latest@sha256:7e0ad922d10ef6f728b521d1a47e83004480687bd4073c97f079c806e3e92a41
    env_file:
      - .env
    command:
      - --model-id
      - ${TEI_RERANKER_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}
      - --port
      - '80'
      - --max-concurrent-requests
      - ${TEI_RERANKER_MAX_CONCURRENT_REQUESTS:-1}
      - --max-batch-tokens
      - ${TEI_RERANKER_MAX_BATCH_TOKENS:-1024}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:80/health']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - rag_reranker_cache:/data
    networks:
      - microservices-net

  rag-vision:
    image: ollama/ollama:latest
    profiles:
      - local-vision
    restart: 'no'
    volumes:
      - rag_vision_cache:/root/.ollama
    networks:
      - microservices-net

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - '127.0.0.1:15672:15672'
      - '127.0.0.1:5672:5672'
    expose:
      - '5672'
      - '15692'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - microservices-net

  # Single-node replica set: Prisma needs one for $transaction on MongoDB. The
  # keyfile is generated once into mongo_config; auth is enabled by the keyfile.
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    entrypoint:
      - bash
      - -c
      - |
        set -e
        if [ ! -s /data/configdb/keyfile ]; then
          openssl rand -base64 756 > /data/configdb/keyfile
        fi
        chown mongodb:mongodb /data/configdb/keyfile
        chmod 400 /data/configdb/keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/configdb/keyfile --bind_ip_all --wiredTigerCacheSizeGB 0.5
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    ports:
      - '127.0.0.1:27017:27017'
    expose:
      - '27017'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: ''rs0'', members: [{ _id: 0, host: ''mongo:27017'' }] }); }" >/dev/null && mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "quit(db.hello().isWritablePrimary ? 0 : 1)"',
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - microservices-net

  # Self-hosted Redis for caches, presence and the Socket.IO adapter. AOF keeps
  # presence:last-seen across restarts; maxmemory mirrors the former cloud plan.
  redis:
    image: redis:8.6
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --appendfsync everysec --save "" --maxmemory 256mb --maxmemory-policy volatile-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'
    expose:
      - '6379'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - microservices-net

  # Self-hosted PostgreSQL (currently the notification database). Version matches the
  # former cloud server so a dump restores 1:1. PostgreSQL 18 images keep their data in a
  # versioned directory, so the volume is mounted one level higher than in older images.
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=60
      - -c
      - work_mem=8MB
      - -c
      - effective_cache_size=768MB
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - '127.0.0.1:5432:5432'
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -h 127.0.0.1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - microservices-net

networks:
  reel-vector-net:
    internal: true
  microservices-net:
    driver: bridge

volumes:
  mongo_data:
  mongo_config:
  redis_data:
  postgres_data:
  rabbitmq_data:
  prometheus_data:
  alloy_data:
  rag_embedding_cache:
  rag_reranker_cache:
  rag_vision_cache:
  qdrant_storage:
  qdrant_snapshots:

secrets:
  qdrant_api_key:
    file: ${QDRANT_SECRET_DIR:-./infra/qdrant/private}/api-key
  qdrant_tls_cert:
    file: ${QDRANT_SECRET_DIR:-./infra/qdrant/private}/server.crt
  qdrant_tls_key:
    file: ${QDRANT_SECRET_DIR:-./infra/qdrant/private}/server.key
  qdrant_tls_ca:
    file: ${QDRANT_SECRET_DIR:-./infra/qdrant/private}/ca.crt
