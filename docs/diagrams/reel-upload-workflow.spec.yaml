question: "How does Velora upload a Reel, fence duplicate media work, and produce validated HLS?"
type: flowchart
audience: "Backend and mobile engineers reviewing Reel upload reliability"
scope: "Velora-Mobile publish path plus backend Reel creation, transactional outbox, RabbitMQ media processing, attempt fencing, HLS generation, validation, and media-to-index handoff"
commit: "backend fd757662; Velora-Mobile 2b044e3 (relevant upload source unchanged by local edits)"
extracted_with:
  - "repository source trace"
  - "Repo Diagrammer evidence IR"

conformance:
  mode: practical
  targets: []
  claim: documented-subset
  notes: []

nodes:
  - id: mobile_publish
    label: "Publish Reel"
    kind: source
    responsibility: "Build the publish payload and call the create mutation; retry the whole mutation at most once after the first failure"
    confidence: direct
    evidence: ["Velora-Mobile/src/hooks/useReelCreator.ts:520-545"]
  - id: request_upload_url
    label: "Request upload URL"
    kind: transformation
    responsibility: "POST /media/upload-url and receive a presigned upload URL plus object key"
    confidence: direct
    evidence: ["Velora-Mobile/src/hooks/useReels.ts:1280-1282", "Velora-Mobile/src/api/media.api.ts:42-44", "apps/api-gateway/src/media/media.controller.ts:31-47"]
  - id: upload_source
    label: "Upload source video"
    kind: transformation
    responsibility: "PUT the local video bytes directly to the presigned object URL"
    confidence: direct
    evidence: ["Velora-Mobile/src/hooks/useReels.ts:1283-1291"]
  - id: create_reel
    label: "Create Reel"
    kind: transformation
    responsibility: "POST /content/reels with mediaKey, metadata, observed duration, and edit request"
    confidence: direct
    evidence: ["Velora-Mobile/src/hooks/useReels.ts:1293-1302", "Velora-Mobile/src/api/reels.api.ts:227-229"]
  - id: persist_reel_outbox
    label: "Persist Reel + media outbox"
    kind: store
    responsibility: "Create Reel and media outbox event in one Content Service transaction with fresh mediaAttemptId/indexAttemptId"
    confidence: direct
    evidence: ["apps/content-service/src/application/use-cases/create-reel.use-case.ts:23-75", "apps/content-service/src/infrastructure/repositories/content.repository.ts:230-291"]
  - id: client_retry
    label: "Retry whole create mutation"
    kind: transformation
    responsibility: "Mobile retries upload URL + PUT + POST once; no explicit create idempotency key is sent"
    confidence: direct
    evidence: ["Velora-Mobile/src/hooks/useReelCreator.ts:528-545", "Velora-Mobile/src/hooks/useReels.ts:1268-1302"]
  - id: dispatch_outbox
    label: "Claim + dispatch outbox"
    kind: transformation
    responsibility: "Claim due events with a claimToken, publish media jobs, mark published, or schedule exponential retry"
    confidence: direct
    evidence: ["apps/content-service/src/application/use-cases/dispatch-outbox-events.use-case.ts:35-109"]
  - id: outbox_retry
    label: "Retry outbox publish"
    kind: transformation
    responsibility: "Release failed publish for another due attempt with exponential delay capped at five minutes"
    confidence: direct
    evidence: ["apps/content-service/src/application/use-cases/dispatch-outbox-events.use-case.ts:80-109"]
  - id: rabbit_media_job
    label: "Durable media job"
    kind: transformation
    responsibility: "Publish persistent RabbitMQ message with jobId as messageId and retry-count header"
    confidence: direct
    evidence: ["apps/content-service/src/infrastructure/adapters/reel-media-job-publisher.adapter.ts:62-81", "apps/content-service/src/infrastructure/adapters/reel-media-job-publisher.adapter.ts:84-125"]
  - id: claim_attempt
    label: "Current media attempt?"
    kind: decision
    responsibility: "Claim only the Reel row whose mediaAttemptId matches and whose status is claimable"
    confidence: direct
    evidence: ["apps/media-processing-service/src/application/use-cases/process-reel.use-case.ts:73-124", "apps/content-service/src/infrastructure/repositories/content.repository.ts:342-375"]
  - id: duplicate_stale
    label: "Ack duplicate / stale"
    kind: sink
    responsibility: "Stop duplicate or stale delivery without overwriting current Reel state"
    confidence: direct
    evidence: ["apps/media-processing-service/src/application/use-cases/process-reel.use-case.ts:119-124", "apps/media-processing-service/src/infrastructure/controllers/media-processing.controller.ts:64-75"]
  - id: prepare_source
    label: "Probe, validate + select profile"
    kind: transformation
    responsibility: "Validate source/trim, classify media, and select an encoding profile"
    confidence: direct
    evidence: ["apps/media-processing-service/src/application/use-cases/prepare-reel-media.use-case.ts:180-250"]
  - id: transcode_hls
    label: "Transcode adaptive HLS"
    kind: transformation
    responsibility: "FFmpeg produces master.m3u8 plus encoded variants and segments"
    confidence: direct
    evidence: ["apps/media-processing-service/src/application/use-cases/prepare-reel-media.use-case.ts:252-288"]
  - id: upload_hls_assets
    label: "Publish HLS + derived assets"
    kind: transformation
    responsibility: "Replace the storage prefix, upload HLS to configured CDN and media storage, then create thumbnail and transcription audio artifacts"
    confidence: direct
    evidence: ["apps/media-processing-service/src/application/use-cases/prepare-reel-media.use-case.ts:290-418"]
  - id: validate_stream
    label: "Stream valid?"
    kind: decision
    responsibility: "Require a readable master playlist, a valid variant, its first segment, and thumbnail"
    confidence: direct
    evidence: ["apps/media-processing-service/src/application/use-cases/validate-reel-stream.use-case.ts:32-84", "apps/media-processing-service/src/application/use-cases/validate-reel-stream.use-case.ts:86-145"]
  - id: retry_media_job
    label: "Retry media job"
    kind: transformation
    responsibility: "For a transient failure, publish bounded retry first, then ACK the original delivery"
    confidence: direct
    evidence: ["apps/media-processing-service/src/infrastructure/controllers/media-processing.controller.ts:38-81", "apps/media-processing-service/src/application/use-cases/process-reel.use-case.ts:292-300"]
  - id: dead_letter
    label: "Reject / DLQ"
    kind: sink
    responsibility: "Malformed, permanent, or exhausted retry deliveries are rejected without requeue"
    confidence: direct
    evidence: ["apps/media-processing-service/src/infrastructure/controllers/media-processing.controller.ts:32-35", "apps/media-processing-service/src/infrastructure/controllers/media-processing.controller.ts:64-72"]
  - id: complete_media
    label: "Commit media completion + index outbox"
    kind: store
    responsibility: "Fence completion by mediaAttemptId, persist HLS metadata, set media completed/index pending, and enqueue the index job in one transaction"
    confidence: direct
    evidence: ["apps/content-service/src/infrastructure/repositories/content.repository.ts:378-466"]
  - id: ready
    label: "HLS ready · indexing queued"
    kind: sink
    responsibility: "Expose the validated HLS master while semantic indexing proceeds asynchronously"
    confidence: direct
    evidence: ["apps/content-service/src/infrastructure/repositories/content.repository.ts:393-405", "apps/content-service/src/infrastructure/repositories/content.repository.ts:424-463"]

