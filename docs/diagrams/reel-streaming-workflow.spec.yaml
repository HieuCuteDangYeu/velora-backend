gaps: []
findings:
  - "Lightweight prefetch and the persistent temporary offline cache are separate paths: prefetch warms only the start of HLS; the offline cache downloads a complete lowest-bandwidth rendition."
  - "Feed playback intentionally keeps the remote HLS URI while online even after an offline cache finishes, avoiding player recreation; cached offline.m3u8 is selected when connectivity is lost."
