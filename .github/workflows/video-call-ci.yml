name: Video Call CI

# The main Homelab CI/CD workflow already runs the call-service unit/E2E
# regression suite for call/notification changes. Keep this workflow only as a
# manual diagnostic entry point so PRs do not spend a second hosted runner on
# duplicate work.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  call-video-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RABBITMQ_URL: amqp://127.0.0.1:5672
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build mediasoup worker
        run: pnpm rebuild mediasoup
      - name: Ensure Redis server for group-call regression
        run: command -v redis-server >/dev/null || (sudo apt-get update && sudo apt-get install -y redis-server)
      - name: Generate notification Prisma client
        run: pnpm prisma:generate:notification
      - name: Build call service
        run: pnpm build:call
      - name: Build notification service
        run: pnpm build:notification
      - name: Run call unit tests
        env:
          DEFAULT_ADMIN_ID: 00000000-0000-4000-8000-000000000001
          BOT_USER_ID: 00000000-0000-4000-8000-000000000002
        run: pnpm exec jest --runInBand apps/call-service/test/unit apps/notification-service/src apps/conversation-service/src/application/use-cases/manage-group-conversation.use-case.spec.ts apps/conversation-service/src/application/use-cases/get-group-members.use-case.spec.ts apps/conversation-service/src/infrastructure/controllers/conversation.realtime.controller.spec.ts apps/api-gateway/src/calls/call.controller.spec.ts
      - name: Run full call E2E
        run: pnpm exec jest --runInBand apps/call-service/test/e2e/call-flow.e2e.spec.ts
