services:
  api-gateway:
    image: ${DOCKERHUB_USERNAME}/api-gateway:latest
    build:
      context: .
      dockerfile: ./apps/api-gateway/Dockerfile
    restart: always
    expose:
      - '3000'
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - '127.0.0.1:80:80'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    networks:
      - microservices-net

  user-service:
    image: ${DOCKERHUB_USERNAME}/user-service:latest
    build:
      context: .
      dockerfile: ./apps/user-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  friend-service:
    image: ${DOCKERHUB_USERNAME}/friend-service:latest
    build:
      context: .
      dockerfile: ./apps/friend-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  auth-service:
    image: ${DOCKERHUB_USERNAME}/auth-service:latest
    build:
      context: .
      dockerfile: ./apps/auth-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  media-service:
    image: ${DOCKERHUB_USERNAME}/media-service:latest
    build:
      context: .
      dockerfile: ./apps/media-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  media-processing-service:
    image: ${DOCKERHUB_USERNAME}/media-processing-service:latest
    build:
      context: .
      dockerfile: ./apps/media-processing-service/Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      MEDIA_WORKER_LANE: SHORT
      MEDIA_WORKER_PREFETCH: ${MEDIA_WORKER_PREFETCH:-1}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  media-processing-long-service:
    image: ${DOCKERHUB_USERNAME}/media-processing-service:latest
    restart: always
    env_file:
      - .env
    environment:
      MEDIA_WORKER_LANE: LONG
      MEDIA_WORKER_PREFETCH: ${MEDIA_WORKER_PREFETCH:-1}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  reel-indexing-service:
    image: ${DOCKERHUB_USERNAME}/reel-indexing-service:latest
    build:
      context: .
      dockerfile: ./apps/reel-indexing-service/Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      # The same image serves both lanes; only the lane differs from .env.
      INDEX_WORKER_LANE: SHORT
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  reel-indexing-long-service:
    image: ${DOCKERHUB_USERNAME}/reel-indexing-service:latest
    restart: always
    env_file:
      - .env
    environment:
      # The same image serves both lanes; only the lane differs from .env.
      INDEX_WORKER_LANE: LONG
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  content-service:
    image: ${DOCKERHUB_USERNAME}/content-service:latest
    build:
      context: .
      dockerfile: ./apps/content-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  payment-service:
    image: ${DOCKERHUB_USERNAME}/payment-service:latest
    build:
      context: .
      dockerfile: ./apps/payment-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    expose:
      - '3006'
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  mail-service:
    image: ${DOCKERHUB_USERNAME}/mail-service:latest
    build:
      context: .
      dockerfile: ./apps/mail-service/Dockerfile
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  conversation-service:
    image: ${DOCKERHUB_USERNAME}/conversation-service:latest
    build:
      context: .
      dockerfile: ./apps/conversation-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    expose:
      - '3005'
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  call-service:
    image: ${DOCKERHUB_USERNAME}/call-service:latest
    build:
      context: .
      dockerfile: ./apps/call-service/Dockerfile
    restart: always
    expose:
      - '3007'
    ports:
      - '40000-40100:40000-40100/udp'
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  monitoring-service:
    image: ${DOCKERHUB_USERNAME}/monitoring-service:latest
    build:
      context: .
      dockerfile: ./apps/monitoring-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    env_file:
      - .env
    expose:
      - '3016'
    depends_on:
      rabbitmq:
        condition: service_healthy
      prometheus:
        condition: service_started
    networks:
      - microservices-net

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    mem_limit: ${PROMETHEUS_MEMORY_LIMIT:-512m}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - '127.0.0.1:9090:9090'
    depends_on:
      - node-exporter
    networks:
      - microservices-net

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    mem_limit: ${NODE_EXPORTER_MEMORY_LIMIT:-64m}
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/.+)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    expose:
      - '9100'
    networks:
      - microservices-net

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    # Velora uses Grafana only as a lightweight Prometheus dashboard. Keep a
    # little memory headroom while avoiding backend plugins and background
    # services that are not part of the homelab observability path.
    mem_limit: ${GRAFANA_MEMORY_LIMIT:-384m}
    env_file:
      - .env
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '127.0.0.1:3001:3000'
    depends_on:
      - prometheus
    networks:
      - microservices-net

  notification-service:
    image: ${DOCKERHUB_USERNAME}/notification-service:latest
    build:
      context: .
      dockerfile: ./apps/notification-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    expose:
      - '3015'
    volumes:
      - ./apps/notification-service/secrets/firebase-admin.json:/usr/src/app/apps/notification-service/secrets/firebase-admin.json:ro
      - ./apps/notification-service/secrets/apns-private-key.p8:/usr/src/app/apps/notification-service/secrets/apns-private-key.p8:ro
    networks:
      - microservices-net

  ai-service:
    image: ${DOCKERHUB_USERNAME}/ai-service:latest
    build:
      context: .
      dockerfile: ./apps/ai-service/Dockerfile
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      rag-embedding:
        condition: service_healthy
      rag-reranker:
        condition: service_healthy
    networks:
      - microservices-net

  rag-embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-latest@sha256:7e0ad922d10ef6f728b521d1a47e83004480687bd4073c97f079c806e3e92a41
    env_file:
      - .env
    command:
      - --model-id
      - ${TEI_EMBEDDING_MODEL:-BAAI/bge-m3}
      - --port
      - '80'
      - --max-concurrent-requests
      - ${TEI_EMBEDDING_MAX_CONCURRENT_REQUESTS:-8}
      - --max-batch-tokens
      - ${TEI_EMBEDDING_MAX_BATCH_TOKENS:-1024}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:80/health']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - rag_embedding_cache:/data
    networks:
      - microservices-net

  rag-reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-latest@sha256:7e0ad922d10ef6f728b521d1a47e83004480687bd4073c97f079c806e3e92a41
    env_file:
      - .env
    command:
      - --model-id
      - ${TEI_RERANKER_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}
      - --port
      - '80'
      - --max-concurrent-requests
      - ${TEI_RERANKER_MAX_CONCURRENT_REQUESTS:-8}
      - --max-batch-tokens
      - ${TEI_RERANKER_MAX_BATCH_TOKENS:-1024}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:80/health']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - rag_reranker_cache:/data
    networks:
      - microservices-net

  rag-vision:
    image: ollama/ollama:latest
    profiles:
      - local-vision
    restart: 'no'
    volumes:
      - rag_vision_cache:/root/.ollama
    networks:
      - microservices-net

  rag-eval:
    image: ${DOCKERHUB_USERNAME:-local}/rag-eval:latest
    build:
      context: .
      dockerfile: ./eval/rag/Dockerfile
      args:
        EVALUATOR_SHA: ${EVALUATOR_SHA:-unknown}
        PRODUCTION_SHA: ${PRODUCTION_SHA:-unknown}
    profiles:
      - eval
    restart: 'no'
    volumes:
      - ${RAG_EVAL_RESULTS_DIR:-./eval/rag/results}:/workspace/eval/rag/results
      - ${RAG_EVAL_EXPERIMENTS_DIR:-./eval/rag/experiments}:/workspace/eval/rag/experiments
      - ${RAG_EVAL_AMI_REPORT_DIR:-./test-data/reel-integration/ami/reports}:/workspace/test-data/reel-integration/ami/reports
    networks:
      - microservices-net

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - '127.0.0.1:15672:15672'
      - '127.0.0.1:5672:5672'
    expose:
      - '5672'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge

volumes:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  rag_embedding_cache:
  rag_reranker_cache:
  rag_vision_cache:
