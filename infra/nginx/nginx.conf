worker_processes auto;
# A proxied WebSocket holds two connections per worker (client and upstream), so
# 1024 per worker capped the stack at about 4,000 sockets; with 8 workers each
# one reached its limit and new connections, even plain logins, were reset.
worker_rlimit_nofile 20000;

events {
    worker_connections 8192;
}

http {
    # Docker's DNS drops a dead container at once; re-resolve every 2 s so a killed
    # replica leaves the upstreams quickly (with valid=10s, half of the sockets of a
    # killed call-service replica needed 13-23 s to rejoin in the fault tests).
    resolver 127.0.0.11 valid=2s ipv6=off;

    log_format upstream_log '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" upstream=$upstream_addr';
    access_log /var/log/nginx/access.log upstream_log;

    # The origin link is 100 Mbit/s and every API response travels it uncompressed (Cloudflare only
    # compresses toward the client): a 20-reel list is 42 KB raw and 8 KB gzipped. Only JSON is
    # compressed, so Socket.IO frames, event streams and media are untouched. `gzip_proxied any`
    # because requests arrive through the Cloudflare tunnel and may carry a Via header.
    gzip on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Round-robin is Nginx's default upstream load-balancing method.
    upstream api_gateway {
        zone api_gateway 64k;
        server api-gateway:3000 resolve;
    }

    upstream conversation_service {
        zone conversation_service 64k;
        server conversation-service:3005 resolve max_fails=1 fail_timeout=10s;
        # The conversation-service replica on the Windows laptop (zone lab2), over
        # Tailscale. Taken out for 5 s after 3 failures, e.g. when the laptop is off.
        server 100.104.227.44:3005 max_fails=3 fail_timeout=5s;
    }

    upstream call_service {
        zone call_service 64k;
        server call-service:3007 resolve max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name _;

        # ChatGateway uses Socket.IO's default /socket.io/ Engine.IO path.
        location ^~ /socket.io/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # A reconnecting socket must not wait for a dead replica: give up on a
            # connect after 2 s and try the next replica (only connection errors and
            # time-outs are retried, before anything was sent upstream).
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            proxy_pass http://conversation_service;
        }

        # CallGateway is in the /call namespace; the client-facing path is
        # /call/socket.io/ while Nest's Engine.IO listener remains /socket.io/.
        location ^~ /call/socket.io/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            proxy_pass http://call_service/socket.io/;
        }

        location / {
            proxy_http_version 1.1;
            proxy_connect_timeout 2s;
            # A 503 can be an application dependency outage (e.g. Auth RPC),
            # not a failed Gateway instance. Retrying it quarantines every
            # healthy Gateway and turns unrelated requests into "no live upstreams".
            proxy_next_upstream error timeout http_502 http_504;
            proxy_next_upstream_tries 2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://api_gateway;
        }
    }
}
