rule_files:
  - ../rules/velora-monitoring.yml

evaluation_interval: 15s

tests:
  - name: database gate is immediately critical
    interval: 15s
    input_series:
      - series: 'velora_deployment_pending{status="database-gate",target_sha="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",deployed_sha="bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb",failed_service="none",reason="Database approval is required.",action="Approve the database change."}'
        values: '1'
    alert_rule_test:
      - eval_time: 0m
        alertname: VeloraDeploymentDatabaseGate
        exp_alerts:
          - exp_labels:
              severity: critical
              service: deployment
              status: database-gate
              target_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              deployed_sha: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
              failed_service: none
              reason: Database approval is required.
              action: Approve the database change.
            exp_annotations:
              summary: production deployment requires database approval
              description: Database approval is required.
              action: Approve the database change.

  - name: health check failure is immediately critical
    interval: 15s
    input_series:
      - series: 'velora_deployment_pending{status="health-check",target_sha="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",deployed_sha="bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb",failed_service="notification-service",reason="notification-service is unhealthy.",action="Inspect notification-service logs."}'
        values: '1'
    alert_rule_test:
      - eval_time: 0m
        alertname: VeloraDeploymentHealthCheckFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              service: deployment
              status: health-check
              target_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              deployed_sha: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
              failed_service: notification-service
              reason: notification-service is unhealthy.
              action: Inspect notification-service logs.
            exp_annotations:
              summary: production deployment failed health checks
              description: notification-service is unhealthy.
              action: Inspect notification-service logs.

  - name: controller error is immediately actionable
    interval: 15s
    input_series:
      - series: 'velora_deployment_pending{status="error",target_sha="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",deployed_sha="bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb",failed_service="api-gateway",reason="Image pull failed.",action="Check Docker Hub and retry."}'
        values: '1'
    alert_rule_test:
      - eval_time: 0m
        alertname: VeloraDeploymentControllerBlocked
        exp_alerts:
          - exp_labels:
              severity: critical
              service: deployment
              status: error
              target_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              deployed_sha: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
              failed_service: api-gateway
              reason: Image pull failed.
              action: Check Docker Hub and retry.
            exp_annotations:
              summary: production deployment controller is blocked
              description: Image pull failed.
              action: Check Docker Hub and retry.

  - name: pending deployment warns after eleven minutes
    interval: 15s
    input_series:
      - series: 'velora_deployment_pending{status="pending",target_sha="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",deployed_sha="bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb",failed_service="none",reason="Deployment is still running.",action="Inspect the deploy service."}'
        values: '1+0x47'
      - series: 'velora_deployment_pending_since_seconds'
        values: '0+0x47'
    alert_rule_test:
      - eval_time: 11m15s
        alertname: VeloraDeploymentStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              service: deployment
              status: pending
              target_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              deployed_sha: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
              failed_service: none
              reason: Deployment is still running.
              action: Inspect the deploy service.
            exp_annotations:
              summary: production deployment has not reached the promoted release
              description: Deployment is still running.
              action: Inspect the deploy service.

  - name: failed deployment does not also fire stalled
    interval: 15s
    input_series:
      - series: 'velora_deployment_pending{status="health-check",target_sha="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",deployed_sha="bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb",failed_service="notification-service",reason="Service is unhealthy.",action="Inspect service logs."}'
        values: '1+0x47'
      - series: 'velora_deployment_pending_since_seconds'
        values: '0+0x47'
    alert_rule_test:
      - eval_time: 11m15s
        alertname: VeloraDeploymentStalled
        exp_alerts: []

  - name: notification service down after one minute
    interval: 15s
    input_series:
      - series: 'up{job="notification-service"}'
        values: '0+0x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: VeloraNotificationServiceDown
        exp_alerts:
          - exp_labels:
              job: notification-service
              severity: critical
              service: notification-service
            exp_annotations:
              summary: notification-service is unavailable
              description: Prometheus has not been able to scrape notification-service for at least one minute.

  - name: notification service one restart is a warning
    interval: 15s
    input_series:
      - series: 'velora_process_start_time_seconds{service="notification-service"}'
        values: '100+0x3 200+0x4'
    alert_rule_test:
      - eval_time: 1m15s
        alertname: VeloraNotificationServiceRestarting
        exp_alerts:
          - exp_labels:
              severity: warning
              service: notification-service
            exp_annotations:
              summary: notification-service restarted
              description: notification-service has restarted one or two times during the last fifteen minutes.

  - name: notification service three restarts are critical
    interval: 15s
    input_series:
      - series: 'velora_process_start_time_seconds{service="notification-service"}'
        values: '100 200 300 400+0x4'
    alert_rule_test:
      - eval_time: 1m15s
        alertname: VeloraNotificationServiceRestartLoop
        exp_alerts:
          - exp_labels:
              severity: critical
              service: notification-service
            exp_annotations:
              summary: notification-service restart loop detected
              description: notification-service has restarted at least three times during the last fifteen minutes.

  - name: notification database outage becomes critical after two minutes
    interval: 15s
    input_series:
      - series: 'velora_notification_database_up{service="notification-service"}'
        values: '0+0x9'
    alert_rule_test:
      - eval_time: 2m
        alertname: VeloraNotificationDatabaseUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              service: notification-service
            exp_annotations:
              summary: notification-service database is unavailable
              description: The notification retry scheduler has not been able to reach its database for two minutes.

  - name: notification scheduler stalls after sixty seconds
    interval: 15s
    input_series:
      - series: 'velora_notification_retry_scheduler_last_completion_timestamp_seconds{service="notification-service"}'
        values: '0+0x5'
    alert_rule_test:
      - eval_time: 1m15s
        alertname: VeloraNotificationRetrySchedulerStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              service: notification-service
            exp_annotations:
              summary: notification retry scheduler is stalled
              description: The notification retry scheduler has not completed a database query for over sixty seconds.

  - name: repeated APNs transport failures become a warning
    interval: 15s
    input_series:
      - series: 'velora_notification_apns_requests_total{service="notification-service",outcome="timeout"}'
        values: '0+1x5'
    alert_rule_test:
      - eval_time: 1m15s
        alertname: VeloraNotificationApnsTransportFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              service: notification-service
            exp_annotations:
              summary: APNs VoIP transport failures are elevated
              description: At least two APNs VoIP timeouts or transport failures occurred during the last five minutes.

  - name: RAG failure alert requires traffic volume
    interval: 15s
    input_series:
      - series: 'velora_rag_requests_total{service="ai-service",outcome="FAILED"}'
        values: '0+1x40'
      - series: 'velora_rag_requests_total{service="ai-service",outcome="SUCCEEDED"}'
        values: '0+4x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: VeloraRagHighFailureRate
        exp_alerts:
          - exp_labels:
              severity: warning
              service: ai-service
            exp_annotations:
              summary: RAG failure rate is above 10 percent
              description: More than 10 percent of RAG requests have failed for five minutes with at least ten requests in the rolling window.

  - name: Reel monitoring snapshot outage becomes critical
    interval: 15s
    input_series:
      - series: 'velora_reel_pipeline_snapshot_up{service="content-service"}'
        values: '0+0x9'
    alert_rule_test:
      - eval_time: 2m
        alertname: VeloraReelMonitoringSnapshotUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              service: content-service
            exp_annotations:
              summary: Reel pipeline monitoring snapshot is unavailable
              description: monitoring-service has been unable to fetch a Reel pipeline snapshot from content-service for two minutes.

  - name: stalled Reel pipeline work warns after two minutes
    interval: 15s
    input_series:
      - series: 'velora_reel_pipeline_items{service="content-service",state="stalled"}'
        values: '1+0x9'
    alert_rule_test:
      - eval_time: 2m
        alertname: VeloraReelPipelineStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              service: content-service
              state: stalled
            exp_annotations:
              summary: Reel pipeline has stalled work
              description: At least one queued or processing Reel has not changed for more than ten minutes.

  - name: recent Reel failure warns after one minute
    interval: 15s
    input_series:
      - series: 'velora_reel_pipeline_recent_failures{service="content-service"}'
        values: '1+0x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: VeloraReelPipelineRecentFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              service: content-service
            exp_annotations:
              summary: Reel pipeline recorded a recent failure
              description: At least one Reel recorded processingFailedAt during the last fifteen minutes.

  - name: Reel RabbitMQ scrape outage becomes critical
    interval: 15s
    input_series:
      - series: 'up{job="rabbitmq-reels"}'
        values: '0+0x9'
    alert_rule_test:
      - eval_time: 2m
        alertname: VeloraReelRabbitMqUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              service: rabbitmq
              job: rabbitmq-reels
            exp_annotations:
              summary: Reel RabbitMQ metrics are unavailable
              description: Prometheus has not been able to scrape the RabbitMQ Reel queue metrics endpoint for two minutes.

  - name: Reel media backlog without consumers becomes critical
    interval: 15s
    input_series:
      - series: 'rabbitmq_detailed_queue_messages_ready{queue="reel_media_short_jobs"}'
        values: '2+0x9'
      - series: 'rabbitmq_detailed_queue_consumers{queue="reel_media_short_jobs"}'
        values: '0+0x9'
    alert_rule_test:
      - eval_time: 2m
        alertname: VeloraReelMediaBacklogWithoutConsumers
        exp_alerts:
          - exp_labels:
              severity: critical
              service: media-processing-service
            exp_annotations:
              summary: Reel media jobs are queued with no consumers
              description: Primary Reel media queues contain ready work but have no consumers for two minutes.

  - name: Reel index dead letter work becomes critical
    interval: 15s
    input_series:
      - series: 'rabbitmq_detailed_queue_messages_ready{queue="reel_index_long_dlq"}'
        values: '1+0x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: VeloraReelIndexDlqNotEmpty
        exp_alerts:
          - exp_labels:
              severity: critical
              service: reel-indexing-service
            exp_annotations:
              summary: Reel index dead-letter queue is not empty
              description: At least one Reel index job exhausted queue retry handling and is waiting in a dead-letter queue.

  - name: exhausted Reel retries warn with pipeline context
    interval: 15s
    input_series:
      - series: 'velora_reel_worker_exhausted_retries_total{pipeline="MEDIA",lane="SHORT"}'
        values: '0+1x21'
    alert_rule_test:
      - eval_time: 5m
        alertname: VeloraReelWorkerExhaustedRetries
        exp_alerts:
          - exp_labels:
              severity: warning
              service: reel-pipeline
              pipeline: MEDIA
            exp_annotations:
              summary: Reel worker retries were exhausted
              description: Reel MEDIA processing exhausted its retry budget during the last five minutes.

  - name: Reel worker failure alert requires recent volume
    interval: 15s
    input_series:
      - series: 'velora_reel_worker_stage_runs_total{pipeline="INDEX",lane="SHORT",stage="TOTAL_PIPELINE",outcome="FAILED",retry_number="0"}'
        values: '0+1x40'
      - series: 'velora_reel_worker_stage_runs_total{pipeline="INDEX",lane="SHORT",stage="TOTAL_PIPELINE",outcome="SUCCEEDED",retry_number="0"}'
        values: '0+3x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: VeloraReelWorkerHighFailureRate
        exp_alerts:
          - exp_labels:
              severity: warning
              service: reel-pipeline
              pipeline: INDEX
            exp_annotations:
              summary: Reel worker failure rate is elevated
              description: Reel INDEX processing has stayed above a 20 percent failure rate for five minutes with at least five recent jobs.

  - name: Auth database outage becomes critical
    interval: 15s
    input_series:
      - series: 'velora_auth_database_up{service="auth-service"}'
        values: '0+0x9'
    alert_rule_test:
      - eval_time: 2m
        alertname: VeloraAuthDatabaseUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              service: auth-service
            exp_annotations:
              summary: auth-service database is unavailable
              description: Auth PostgreSQL health checks have failed for two minutes.

  - name: Refresh replay produces an Auth warning
    interval: 15s
    input_series:
      - series: 'velora_auth_refresh_rotations_total{service="auth-service",outcome="replay_detected"}'
        values: '0+1x21'
    alert_rule_test:
      - eval_time: 5m
        alertname: VeloraAuthRefreshReplayDetected
        exp_alerts:
          - exp_labels:
              severity: warning
              service: auth-service
              outcome: replay_detected
            exp_annotations:
              summary: Refresh-token replay was detected
              description: Auth detected at least one refresh-token replay during the last five minutes.

  - name: User database outage becomes critical
    interval: 15s
    input_series:
      - series: 'velora_user_database_up{service="user-service"}'
        values: '0+0x9'
    alert_rule_test:
      - eval_time: 2m
        alertname: VeloraUserDatabaseUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              service: user-service
            exp_annotations:
              summary: user-service database is unavailable
              description: User PostgreSQL health checks have failed for two minutes.

  - name: User queue backlog without consumers becomes critical
    interval: 15s
    input_series:
      - series: 'rabbitmq_detailed_queue_messages_ready{job="rabbitmq-auth-user",queue="user_queue"}'
        values: '2+0x9'
      - series: 'rabbitmq_detailed_queue_consumers{job="rabbitmq-auth-user",queue="user_queue"}'
        values: '0+0x9'
    alert_rule_test:
      - eval_time: 2m
        alertname: VeloraUserQueueBacklogWithoutConsumers
        exp_alerts:
          - exp_labels:
              severity: critical
              service: user-service
            exp_annotations:
              summary: user_queue has backlog with no consumers
              description: User requests are queued but user_queue has no consumers for two minutes.
