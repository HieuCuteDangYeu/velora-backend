  - { id: e08, from: dispatch_outbox, to: rabbit_media_job, relation: publishes, label: "publish succeeds", condition: "claimed event is valid", evidence: ["apps/content-service/src/application/use-cases/dispatch-outbox-events.use-case.ts:53-79"] }
