name: friend-mail
services:
  friend-service:
    image: ${DOCKERHUB_USERNAME}/friend-service:${FRIEND_SERVICE_TAG}
    container_name: friend-service
    restart: unless-stopped
    # linux/amd64 image built by the Homelab CD (job build-and-push-node2-images) and
    # rolled out by deploy.sh. It consumes friend_queue on the homelab RabbitMQ and
    # reads the Aiven friend database; there is no HTTP port.
    env_file:
      - .env # RABBITMQ_URL, FRIEND_DATABASE_URL, DEFAULT_ADMIN_ID and BOT_USER_ID only
    extra_hosts:
      - 'rabbitmq:100.102.228.48'
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'

  mail-service:
    image: ${DOCKERHUB_USERNAME}/mail-service:${MAIL_SERVICE_TAG}
    container_name: mail-service
    restart: unless-stopped
    # Consumes mail_queue and sends through Resend over HTTPS.
    env_file:
      - .env # RABBITMQ_URL, RESEND_API_KEY and RESEND_FROM_EMAIL only
    extra_hosts:
      - 'rabbitmq:100.102.228.48'
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'

  # Reel media worker for the LONG lane (reel_media_long_jobs), the only media worker on this
  # node: same image as the homelab arm64 one, built for amd64. The homelab runs the SHORT
  # worker; measured on 2026-11-15, short jobs took 246 s here against 137 s on the homelab
  # (CPU-bound, this host is shared with Langfuse and the DB replicas), so it does not take
  # short jobs. It downloads and transcodes with ffmpeg in /tmp and uploads to R2. CPU is
  # capped and given a low weight so the replicas and call-media-2 keep priority.
  media-processing-long-service:
    image: ${DOCKERHUB_USERNAME}/media-processing-service:${MEDIA_PROCESSING_SERVICE_TAG}
    container_name: media-processing-long-service
    restart: unless-stopped
    env_file:
      - media.env
    environment:
      MEDIA_WORKER_LANE: LONG
      MEDIA_WORKER_PREFETCH: '1'
      TIKTOK_CDN_ENABLED: 'false'
    cpus: 2
    cpu_shares: 256
    mem_limit: 2g
    extra_hosts:
      - 'rabbitmq:100.102.228.48'
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
