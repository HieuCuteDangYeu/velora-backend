gaps: []
findings:
  - "Client publish retry is not protected by an explicit create idempotency key; a retry can request a new upload URL, upload again, and POST /content/reels again."
  - "Backend media work is protected by transactional outbox delivery and mediaAttemptId fencing; stale completion cannot overwrite the current attempt."
