gaps:
  - "The retrieval graph can bypass the optional tool-calling wrapper when disabled, and the wrapper itself falls back to deterministic retrieval when it produces no evidence or errors; the rendering expands this inside retrievalNode rather than adding a second LangGraph node."
findings:
  - "Production hierarchical serving is gated by RAG_HIERARCHICAL_RETRIEVAL_PROMOTION_APPROVED; when requested but not approved, direct retrieval serves while hierarchy can run in shadow."
  - "The HTML renderer is Diagram Design; renderer/fallback above describe Repo Diagrammer's portable source-rendering preference for this flowchart type."
