name: Homelab CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      build_all:
        description: Validate every application Docker image instead of only affected images
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Only stale runs for the same PR are cancelled. Pushes to master deliberately
# get a unique group so independent CI runs can execute concurrently. Production
# serialization lives in the separate Homelab CD workflow.
concurrency:
  group: homelab-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    runs-on: ubuntu-24.04
    outputs:
      build_matrix_json: ${{ steps.detect.outputs.build_matrix_json }}
      build_services_list: ${{ steps.detect.outputs.build_services_list }}
      call_regression_required: ${{ steps.detect.outputs.call_regression_required }}
      friend_recommendation_required: ${{ steps.detect.outputs.friend_recommendation_required }}
      rag_evaluator_required: ${{ steps.detect.outputs.rag_evaluator_required }}
      comparison_base: ${{ steps.detect.outputs.comparison_base }}
      checkout_sha: ${{ steps.detect.outputs.checkout_sha }}
      is_release_candidate: ${{ steps.detect.outputs.is_release_candidate }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Detect affected application images
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          all_services=(
            api-gateway
            user-service
            friend-service
            auth-service
            media-service
            media-processing-service
            reel-indexing-service
            content-service
            payment-service
            mail-service
            conversation-service
            call-service
            monitoring-service
            notification-service
            ai-service
          )

          event_name='${{ github.event_name }}'
          head_sha="$(git rev-parse HEAD)"
          comparison_base=''
          build_all=false
          is_release_candidate=false

          if [ "$event_name" = 'workflow_dispatch' ] && [ "$GITHUB_REF" != 'refs/heads/master' ]; then
            echo 'workflow_dispatch must be started from master.' >&2
            exit 1
          fi

          case "$event_name" in
            pull_request)
              comparison_base='${{ github.event.pull_request.base.sha }}'
              ;;
            push)
              is_release_candidate=true
              comparison_base='${{ github.event.before }}'
              if [ -z "$comparison_base" ] || [[ "$comparison_base" =~ ^0+$ ]]; then
                comparison_base=''
                build_all=true
              fi
              ;;
            workflow_dispatch)
              is_release_candidate=true
              if [ '${{ inputs.build_all }}' = 'true' ]; then
                build_all=true
              else
                comparison_base="$(git rev-parse HEAD^ 2>/dev/null || true)"
                [ -n "$comparison_base" ] || build_all=true
              fi
              ;;
            *)
              echo "Unsupported event: $event_name" >&2
              exit 1
              ;;
          esac

          if [ -n "$comparison_base" ]; then
            if ! git cat-file -e "${comparison_base}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$comparison_base"
            fi
            changed_files="$(git diff --name-only "$comparison_base" "$head_sha")"
          else
            changed_files='__BUILD_ALL__'
            build_all=true
          fi

          echo 'Changed files:'
          printf '%s\n' "$changed_files"

          build_services=()
          build_service_count=0
          add_build_service() {
            local candidate="$1"
            for service in "${build_services[@]:-}"; do
              [ "$service" = "$candidate" ] && return
            done
            build_services+=("$candidate")
            build_service_count=$((build_service_count + 1))
          }

          if [ "$build_all" != true ]; then
            while IFS= read -r changed_file; do
              [ -z "$changed_file" ] && continue

              case "$changed_file" in
                docker-compose.yml|docker-compose.yaml|docker-compose.*.yml|docker-compose.*.yaml|compose.yml|compose.yaml|infra/nginx/*|.env.example|.github/*|docs/*|eval/rag/*|libs/*|scripts/ops/provider-reliability-characterization.cjs|scripts/ops/provider-reliability-characterization.test.cjs|README.md|QWEN.md|CLAUDE.md|LICENSE*|*.md|.gitignore|.prettierrc|eslint.config.mjs|jest.config.cjs|.vscode/*)
                  continue
                  ;;
              esac

              case "$changed_file" in
                package.json|pnpm-lock.yaml|pnpm-workspace.yaml|nest-cli.json|tsconfig.json|tsconfig.build.json|.npmrc|.dockerignore|scripts/*|Dockerfile|Dockerfile.*|docker/*|infra/docker/*)
                  build_all=true
                  break
                  ;;
              esac

              matched_service=false
              for service in "${all_services[@]}"; do
                if [[ "$changed_file" == "apps/${service}/"* ]]; then
                  add_build_service "$service"
                  matched_service=true
                  break
                fi
              done

              if [ "$matched_service" = false ]; then
                build_all=true
                break
              fi
            done <<< "$changed_files"
          fi

          if [ "$build_all" = true ]; then
            build_services=("${all_services[@]}")
            build_service_count="${#all_services[@]}"
          fi

          temporary_env_file='.env'
          if [ -e "$temporary_env_file" ]; then
            echo "Refusing to overwrite existing $temporary_env_file in CI workspace." >&2
            exit 1
          fi
          install -m 600 /dev/null "$temporary_env_file"
          trap 'rm -f -- "$temporary_env_file"' EXIT

          dockerhub_placeholder='ci-placeholder'
          compose_build_matrix="$(
            COMPOSE_DISABLE_ENV_FILE=1 \
              DOCKERHUB_USERNAME="$dockerhub_placeholder" \
              RABBITMQ_DEFAULT_USER=ci \
              RABBITMQ_DEFAULT_PASS=ci \
              RABBITMQ_DEFAULT_VHOST=/ \
              RABBITMQ_URL=amqp://ci:ci@rabbitmq:5672/ \
              docker compose config --no-env-resolution --no-path-resolution --format json \
                | jq -ce --arg prefix "${dockerhub_placeholder}/" '
                    [
                      .services
                      | to_entries[]
                      | select(.value.build != null and .key != "rag-eval")
                      | {
                          service: .key,
                          context: .value.build.context,
                          dockerfile: .value.build.dockerfile,
                          image: (
                            .value.image
                            | if startswith($prefix) and endswith(":latest") then
                                ltrimstr($prefix) | rtrimstr(":latest")
                              else
                                error("compose build image must use the CI Docker Hub namespace and :latest")
                              end
                          )
                        }
                    ]
                    | sort_by(.service)
                  '
          )"

          expected_services_json="$(printf '%s\n' "${all_services[@]}" | jq -R . | jq -cs 'sort')"
          actual_services_json="$(jq -c '[.[].service] | sort' <<< "$compose_build_matrix")"
          if [ "$expected_services_json" != "$actual_services_json" ]; then
            echo 'The explicit application service list does not match Compose build services.' >&2
            exit 1
          fi

          while IFS=$'\t' read -r service context dockerfile image; do
            if [ "$context" != '.' ]; then
              echo "${service} uses unsupported build context ${context}; update this workflow intentionally." >&2
              exit 1
            fi
            if [ ! -f "$dockerfile" ]; then
              echo "${service} Dockerfile does not exist: ${dockerfile}" >&2
              exit 1
            fi
            if [ -z "$image" ]; then
              echo "${service} has no Docker Hub repository name." >&2
              exit 1
            fi
          done < <(jq -r '.[] | [.service, .context, .dockerfile, .image] | @tsv' <<< "$compose_build_matrix")

          if [ "$build_service_count" -eq 0 ]; then
            build_matrix_json='[]'
            build_services_list=''
          else
            requested_services_json="$(printf '%s\n' "${build_services[@]}" | jq -R . | jq -cs .)"
            build_matrix_json="$(jq -c --argjson requested "$requested_services_json" '[.[] | select(.service as $service | $requested | index($service))]' <<< "$compose_build_matrix")"
            build_services_list="$(jq -r '[.[].service] | join(" ")' <<< "$build_matrix_json")"
          fi

          call_regression_required=false
          if [ "$build_all" = true ] || printf '%s\n' "$changed_files" | grep -Eq '^(apps/(call-service|notification-service|conversation-service|api-gateway|monitoring-service)/|libs/common/src/calls/|infra/nginx/|docker-compose\.ya?ml$)'; then
            call_regression_required=true
          fi

          friend_recommendation_required=false
          if [ "$build_all" = true ] || printf '%s\n' "$changed_files" | grep -Eq '^(apps/(friend-service|user-service)/|libs/common/src/(friend|recommendation|user)/|\.github/workflows/deploy\.yml$|package\.json$|pnpm-lock\.yaml$|jest\.config\.cjs$|eslint\.config\.mjs$|\.prettierrc$)'; then
            friend_recommendation_required=true
          fi

          rag_evaluator_required=false
          if [ "$is_release_candidate" = true ] || printf '%s\n' "$changed_files" | grep -Eq '^(eval/rag/|apps/ai-service/|apps/conversation-service/prisma/|apps/reel-indexing-service/prisma/|libs/|scripts/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|nest-cli\.json$|tsconfig(\.build)?\.json$|\.npmrc$|\.dockerignore$|\.github/workflows/(deploy|cd)\.yml$)'; then
            rag_evaluator_required=true
          fi

          echo "Build services: ${build_services_list:-none}"
          echo "Call regression required: $call_regression_required"
          echo "Friend recommendation regression required: $friend_recommendation_required"
          echo "RAG evaluator required: $rag_evaluator_required"
          {
            printf 'build_matrix_json=%s\n' "$build_matrix_json"
            printf 'build_services_list=%s\n' "$build_services_list"
            printf 'call_regression_required=%s\n' "$call_regression_required"
            printf 'friend_recommendation_required=%s\n' "$friend_recommendation_required"
            printf 'rag_evaluator_required=%s\n' "$rag_evaluator_required"
            printf 'comparison_base=%s\n' "$comparison_base"
            printf 'checkout_sha=%s\n' "$head_sha"
            printf 'is_release_candidate=%s\n' "$is_release_candidate"
          } >> "$GITHUB_OUTPUT"

  validate:
    needs: detect-changes
    runs-on: ubuntu-24.04
    env:
      AI_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ai?schema=public
      AUTH_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/auth?schema=public
      CONTENT_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/content?schema=public
      CONVERSATION_DATABASE_URL: mongodb://127.0.0.1:27017/conversation
      FRIEND_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/friend?schema=public
      MONITORING_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/monitoring?schema=public
      NOTIFICATION_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/notification?schema=public
      PAYMENT_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/payment?schema=public
      RABBITMQ_URL: amqp://127.0.0.1:5672
      REEL_INDEXING_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/reel_indexing?schema=public
      USER_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/user?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect-changes.outputs.checkout_sha }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Check whitespace errors
        env:
          COMPARISON_BASE: ${{ needs.detect-changes.outputs.comparison_base }}
          COMPARISON_HEAD: ${{ needs.detect-changes.outputs.checkout_sha }}
        run: |
          set -euo pipefail
          git diff --check
          if [ -n "$COMPARISON_BASE" ]; then
            if ! git cat-file -e "${COMPARISON_BASE}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$COMPARISON_BASE"
            fi
            git diff --check "$COMPARISON_BASE" "$COMPARISON_HEAD"
          fi

      - name: Validate Docker Compose without a production env file
        run: |
          set -euo pipefail
          temporary_env_file='.env'
          if [ -e "$temporary_env_file" ]; then
            echo "Refusing to overwrite existing $temporary_env_file in CI workspace." >&2
            exit 1
          fi
          install -m 600 /dev/null "$temporary_env_file"
          trap 'rm -f -- "$temporary_env_file"' EXIT

          cat > "$temporary_env_file" <<'EOF'
          RABBITMQ_DEFAULT_USER=ci
          RABBITMQ_DEFAULT_PASS=ci
          RABBITMQ_DEFAULT_VHOST=/
          RABBITMQ_URL=amqp://ci:ci@rabbitmq:5672/
          EOF
          node scripts/ops/validate-rabbitmq-config.cjs --env-file "$temporary_env_file"

          COMPOSE_DISABLE_ENV_FILE=1 \
            DOCKERHUB_USERNAME=ci-placeholder \
            RABBITMQ_DEFAULT_USER=ci \
            RABBITMQ_DEFAULT_PASS=ci \
            RABBITMQ_DEFAULT_VHOST=/ \
            RABBITMQ_URL=amqp://ci:ci@rabbitmq:5672/ \
            docker compose config --no-env-resolution --quiet

      - name: Validate Nginx configuration
        run: |
          docker run --rm \
            -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:alpine nginx -t

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build mediasoup worker for call regression
        if: needs.detect-changes.outputs.call_regression_required == 'true'
        run: pnpm rebuild mediasoup

      - name: Ensure Redis server for group-call regression
        if: needs.detect-changes.outputs.call_regression_required == 'true'
        run: command -v redis-server >/dev/null || (sudo apt-get update && sudo apt-get install -y redis-server)

      - name: Generate Prisma clients
        run: pnpm run prisma:generate:all

      - name: Check friend recommendation formatting
        if: needs.detect-changes.outputs.friend_recommendation_required == 'true'
        run: >-
          pnpm exec prettier --check
          apps/friend-service/src/application/use-cases/get-graph-friend-recommendations.use-case.ts
          apps/friend-service/src/application/use-cases/get-graph-friend-recommendations.use-case.spec.ts
          apps/friend-service/src/domain/interfaces/friend-graph.repository.interface.ts
          apps/friend-service/src/infrastructure/repositories/friend-graph.repository.ts
          apps/friend-service/src/infrastructure/repositories/friend-graph.repository.integration.spec.ts
          apps/user-service/src/application/use-cases/get-recommended-public-users.use-case.ts
          apps/user-service/src/application/use-cases/get-recommended-public-users.use-case.spec.ts
          apps/user-service/src/infrastructure/adapters/friend-discovery-service.adapter.ts
          apps/user-service/src/infrastructure/adapters/friend-discovery-service.adapter.spec.ts
          apps/user-service/src/infrastructure/services/recommendation-config.service.ts
          apps/user-service/src/infrastructure/services/recommendation-config.service.spec.ts
          libs/common/src/friend/interfaces/friend-recommendation.interface.ts
          libs/common/src/friend/schemas/friend-recommendation.schema.ts

      - name: Lint friend recommendation changes
        if: needs.detect-changes.outputs.friend_recommendation_required == 'true'
        run: >-
          pnpm exec eslint
          apps/friend-service/src/application/use-cases/get-graph-friend-recommendations.use-case.ts
          apps/friend-service/src/application/use-cases/get-graph-friend-recommendations.use-case.spec.ts
          apps/friend-service/src/domain/interfaces/friend-graph.repository.interface.ts
          apps/friend-service/src/infrastructure/repositories/friend-graph.repository.ts
          apps/friend-service/src/infrastructure/repositories/friend-graph.repository.integration.spec.ts
          apps/user-service/src/application/use-cases/get-recommended-public-users.use-case.ts
          apps/user-service/src/application/use-cases/get-recommended-public-users.use-case.spec.ts
          apps/user-service/src/infrastructure/adapters/friend-discovery-service.adapter.ts
          apps/user-service/src/infrastructure/adapters/friend-discovery-service.adapter.spec.ts
          apps/user-service/src/infrastructure/services/recommendation-config.service.ts
          apps/user-service/src/infrastructure/services/recommendation-config.service.spec.ts
          libs/common/src/friend/interfaces/friend-recommendation.interface.ts
          libs/common/src/friend/schemas/friend-recommendation.schema.ts

      - name: Start friend recommendation PostgreSQL
        if: needs.detect-changes.outputs.friend_recommendation_required == 'true'
        run: |
          set -euo pipefail
          docker run --detach --name friend-recommendation-postgres \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_DB=friend_recommendation_ci \
            --publish 5432:5432 \
            postgres:16

          for attempt in {1..30}; do
            if docker exec friend-recommendation-postgres \
              pg_isready -U postgres -d friend_recommendation_ci >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done

          docker logs friend-recommendation-postgres
          echo 'Friend recommendation PostgreSQL did not become ready.' >&2
          exit 1

      - name: Create friend recommendation CI schema
        if: needs.detect-changes.outputs.friend_recommendation_required == 'true'
        env:
          FRIEND_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/friend_recommendation_ci?schema=public
        run: pnpm exec prisma db push --schema=apps/friend-service/prisma/schema.prisma --skip-generate

      - name: Run friend recommendation regression tests
        if: needs.detect-changes.outputs.friend_recommendation_required == 'true'
        env:
          FRIEND_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/friend_recommendation_ci?schema=public
          FRIEND_GRAPH_INTEGRATION_TEST: '1'
        run: >-
          pnpm exec jest --runInBand
          apps/friend-service/src/application/use-cases/get-graph-friend-recommendations.use-case.spec.ts
          apps/friend-service/src/infrastructure/repositories/friend-graph.repository.integration.spec.ts
          apps/user-service/src/application/use-cases/get-recommended-public-users.use-case.spec.ts
          apps/user-service/src/infrastructure/adapters/friend-discovery-service.adapter.spec.ts
          apps/user-service/src/infrastructure/services/recommendation-config.service.spec.ts

      - name: Build all Nest applications
        run: pnpm run build:all

      - name: Verify API Gateway Swagger DTOs
        run: pnpm exec jest --runInBand libs/common/src/content/dtos/reel-series.dto.spec.ts

      - name: Run call unit regression tests
        if: needs.detect-changes.outputs.call_regression_required == 'true'
        env:
          DEFAULT_ADMIN_ID: 00000000-0000-4000-8000-000000000001
          BOT_USER_ID: 00000000-0000-4000-8000-000000000002
        run: pnpm exec jest --runInBand apps/call-service/test/unit apps/notification-service/src apps/conversation-service/src/application/use-cases/manage-group-conversation.use-case.spec.ts apps/conversation-service/src/application/use-cases/get-group-members.use-case.spec.ts apps/conversation-service/src/infrastructure/controllers/conversation.realtime.controller.spec.ts

      - name: Run call E2E regression test
        if: needs.detect-changes.outputs.call_regression_required == 'true'
        run: pnpm exec jest --runInBand apps/call-service/test/e2e/call-flow.e2e.spec.ts

      - name: Stop friend recommendation PostgreSQL
        if: always() && needs.detect-changes.outputs.friend_recommendation_required == 'true'
        run: docker rm --force friend-recommendation-postgres || true

  rag-evaluator-ci:
    needs: [detect-changes, validate]
    if: needs.detect-changes.outputs.rag_evaluator_required == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect-changes.outputs.checkout_sha }}

      - name: Build isolated RAG evaluator image
        env:
          CHECKOUT_SHA: ${{ needs.detect-changes.outputs.checkout_sha }}
        run: |
          set -euo pipefail
          docker build \
            --file eval/rag/Dockerfile \
            --build-arg "EVALUATOR_SHA=$CHECKOUT_SHA" \
            --build-arg PRODUCTION_SHA=ci-not-deployed \
            --tag "velora-rag-eval-ci:$CHECKOUT_SHA" \
            .

      - name: Run evaluator tests with zero provider calls
        env:
          CHECKOUT_SHA: ${{ needs.detect-changes.outputs.checkout_sha }}
        run: |
          set -euo pipefail
          docker run --rm \
            "velora-rag-eval-ci:$CHECKOUT_SHA" \
            pnpm eval:rag:test

      - name: Run offline RAG generalization gate
        env:
          CHECKOUT_SHA: ${{ needs.detect-changes.outputs.checkout_sha }}
        run: |
          set -euo pipefail
          docker run --rm \
            "velora-rag-eval-ci:$CHECKOUT_SHA" \
            pnpm eval:rag:offline --dataset rag-generalization-v1

  build-images:
    needs: [detect-changes, validate, rag-evaluator-ci]
    if: >-
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.validate.result == 'success' &&
      (needs.rag-evaluator-ci.result == 'success' || needs.rag-evaluator-ci.result == 'skipped') &&
      needs.detect-changes.outputs.build_matrix_json != '[]'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      # Keep each CI run to one ARM slot so multiple PR/master validations can
      # make progress instead of one broad change monopolizing the ARM pool.
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.build_matrix_json) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect-changes.outputs.checkout_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ARM64 image without publishing
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-arm64
