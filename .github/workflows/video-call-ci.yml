name: Video Call CI

on:
  pull_request:
    branches:
      - master
    paths:
      - 'apps/call-service/**'
      - 'apps/notification-service/**'
      - '.github/workflows/video-call-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# New commits to the same PR replace stale call-regression work instead of
# occupying another runner slot. Different PRs still run independently.
concurrency:
  group: video-call-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  call-video-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RABBITMQ_URL: amqp://127.0.0.1:5672
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build mediasoup worker
        run: pnpm rebuild mediasoup
      - name: Generate notification Prisma client
        run: pnpm prisma:generate:notification
      - name: Build call service
        run: pnpm build:call
      - name: Build notification service
        run: pnpm build:notification
      - name: Run call unit tests
        run: pnpm exec jest --runInBand apps/call-service/test/unit/application
      - name: Run full call E2E
        run: pnpm exec jest --runInBand apps/call-service/test/e2e/call-flow.e2e.spec.ts
