services:
  monitoring-service:
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
    depends_on:
      loki:
        condition: service_started

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    mem_limit: ${LOKI_MEMORY_LIMIT:-384m}
    command:
      - -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./infra/monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - '127.0.0.1:3100:3100'
    networks:
      - microservices-net

  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    mem_limit: ${ALLOY_MEMORY_LIMIT:-192m}
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./infra/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started
    networks:
      - microservices-net

  grafana:
    environment:
      GF_PLUGINS_DISABLE_PLUGINS: elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,mssql,mysql,opentsdb,stackdriver,tempo,zipkin,grafana-metricsdrilldown-app,grafana-advisor-app,grafana-pyroscope-app,grafana-exploretraces-app,grafana-lokiexplore-app
    depends_on:
      - prometheus
      - loki

volumes:
  loki_data:
  alloy_data:
