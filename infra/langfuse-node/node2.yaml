# velora-node-2 overrides: publish only the web UI/ingestion API and MinIO (browser
# media uploads), both on the Tailscale address. Nothing is reachable from the public
# interface, and the databases stay on the private Compose network.
services:
  langfuse-web:
    ports: !override
      - ${TAILNET_IP:?set TAILNET_IP in .env}:13000:3000
    environment:
      # The UI is published on a public hostname through the Cloudflare tunnel, so
      # nobody may create their own account. Add users from Settings > Members.
      AUTH_DISABLE_SIGNUP: 'true'
  langfuse-worker:
    ports: !reset []
  clickhouse:
    ports: !reset []
  minio:
    ports: !override
      - ${TAILNET_IP:?set TAILNET_IP in .env}:19090:9000
  redis:
    ports: !reset []
  postgres:
    ports: !reset []
