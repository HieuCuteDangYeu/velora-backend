services:
  monitoring-service:
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    mem_limit: ${PROMETHEUS_MEMORY_LIMIT:-512m}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - '127.0.0.1:9090:9090'
    networks:
      - microservices-net

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    mem_limit: ${NODE_EXPORTER_MEMORY_LIMIT:-64m}
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro
    networks:
      - microservices-net

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    mem_limit: ${LOKI_MEMORY_LIMIT:-384m}
    command:
      - -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./infra/monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - '127.0.0.1:3100:3100'
    networks:
      - microservices-net

  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    mem_limit: ${ALLOY_MEMORY_LIMIT:-192m}
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./infra/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started
    networks:
      - microservices-net

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    mem_limit: ${GRAFANA_MEMORY_LIMIT:-256m}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '127.0.0.1:3001:3000'
    depends_on:
      - prometheus
      - loki
    networks:
      - microservices-net

volumes:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:
