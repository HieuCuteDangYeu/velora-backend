name: mongo-replica
services:
  mongo-replica:
    image: mongo:8.0.34
    container_name: mongo-replica
    restart: unless-stopped
    # rs0 is shard 1 of the sharded cluster, so every member runs as a shard server.
    command: ["mongod", "--shardsvr", "--port", "27017", "--replSet", "rs0", "--keyFile", "/etc/mongo/keyfile", "--bind_ip_all", "--wiredTigerCacheSizeGB", "2"]
    extra_hosts:
      - "mongo:100.102.228.48"
      # Config server on the homelab (tailscale serve --tcp 27019).
      - "mongo-cfg:100.102.228.48"
      # Shard 2 (rs1) on the Windows laptop; shard members monitor every shard.
      - "sh2.lab:100.104.227.44"
    ports:
      - "100.86.68.16:27017:27017"
    volumes:
      - mongo_replica_data:/data/db
      - /opt/velora/mongo-replica/keyfile:/etc/mongo/keyfile:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand({ping:1}).ok\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
volumes:
  mongo_replica_data:
