groups:
  - name: velora-host
    rules:
      - alert: VeloraHostDown
        expr: up{job="node-exporter"} == 0
        for: 1m
        labels:
          severity: critical
          service: node-exporter
        annotations:
          summary: monitored host exporter is unavailable
          description: Prometheus has not been able to scrape node-exporter for at least one minute.

      - alert: VeloraHostHighCpu
        expr: |
          1 - avg(rate(node_cpu_seconds_total{job="node-exporter",mode="idle"}[5m]))
          > 0.7
        for: 5m
        labels:
          severity: warning
          service: node-exporter
        annotations:
          summary: host CPU usage is above 70 percent
          description: CPU usage across the monitored host has remained above 70 percent for five minutes.

      - alert: VeloraHostHighMemory
        expr: |
          1 - (
            max(node_memory_MemAvailable_bytes{job="node-exporter"})
            / clamp_min(max(node_memory_MemTotal_bytes{job="node-exporter"}), 1)
          ) > 0.75
        for: 5m
        labels:
          severity: warning
          service: node-exporter
        annotations:
          summary: host memory usage is above 75 percent
          description: Host memory usage based on MemAvailable has remained above 75 percent for five minutes.

      - alert: VeloraHostDiskAlmostFull
        expr: |
          1 - (
            max(node_filesystem_avail_bytes{
              job="node-exporter",
              mountpoint=~"^/$|^/opt/orbstack-guest/data$",
              fstype!~"tmpfs|overlay|squashfs"
            })
            / clamp_min(max(node_filesystem_size_bytes{
              job="node-exporter",
              mountpoint=~"^/$|^/opt/orbstack-guest/data$",
              fstype!~"tmpfs|overlay|squashfs"
            }), 1)
          ) > 0.8
        for: 5m
        labels:
          severity: warning
          service: node-exporter
        annotations:
          summary: monitored filesystem is above 80 percent full
          description: Usage of the monitored Docker host filesystem has remained above 80 percent for five minutes.

      - alert: VeloraDeploymentDatabaseGate
        expr: velora_deployment_pending{status="database-gate"} == 1
        for: 0m
        labels:
          severity: critical
          service: deployment
        annotations:
          summary: production deployment requires database approval
          description: '{{ $labels.reason }}'
          action: '{{ $labels.action }}'

      - alert: VeloraDeploymentHealthCheckFailed
        expr: velora_deployment_pending{status="health-check"} == 1
        for: 0m
        labels:
          severity: critical
          service: deployment
        annotations:
          summary: production deployment failed health checks
          description: '{{ $labels.reason }}'
          action: '{{ $labels.action }}'

      - alert: VeloraDeploymentControllerBlocked
        expr: velora_deployment_pending{status=~"config-drift|error"} == 1
        for: 0m
        labels:
          severity: critical
          service: deployment
        annotations:
          summary: production deployment controller is blocked
          description: '{{ $labels.reason }}'
          action: '{{ $labels.action }}'

      - alert: VeloraDeploymentStalled
        expr: |
          velora_deployment_pending{status="pending"} == 1
          and on() (time() - velora_deployment_pending_since_seconds) > 600
        for: 1m
        labels:
          severity: warning
          service: deployment
        annotations:
          summary: production deployment has not reached the promoted release
          description: '{{ $labels.reason }}'
          action: '{{ $labels.action }}'

      - alert: VeloraConversationServiceDown
        expr: up{job="conversation-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: conversation-service
        annotations:
          summary: conversation-service is unavailable
          description: Prometheus has not been able to scrape conversation-service for at least one minute.

      - alert: VeloraCallServiceDown
        expr: up{job="call-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: call-service
        annotations:
          summary: call-service is unavailable
          description: Prometheus has not been able to scrape call-service for at least one minute.

      - alert: VeloraNotificationServiceDown
        expr: up{job="notification-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: notification-service
        annotations:
          summary: notification-service is unavailable
          description: Prometheus has not been able to scrape notification-service for at least one minute.

  - name: velora-notification-service
    rules:
      - alert: VeloraNotificationServiceRestarting
        expr: |
          changes(velora_process_start_time_seconds{service="notification-service"}[15m]) >= 1
          unless changes(velora_process_start_time_seconds{service="notification-service"}[15m]) >= 3
        labels:
          severity: warning
          service: notification-service
        annotations:
          summary: notification-service restarted
          description: notification-service has restarted one or two times during the last fifteen minutes.

      - alert: VeloraNotificationServiceRestartLoop
        expr: changes(velora_process_start_time_seconds{service="notification-service"}[15m]) >= 3
        labels:
          severity: critical
          service: notification-service
        annotations:
          summary: notification-service restart loop detected
          description: notification-service has restarted at least three times during the last fifteen minutes.

      - alert: VeloraNotificationDatabaseUnavailable
        expr: velora_notification_database_up{service="notification-service"} == 0
        for: 2m
        labels:
          severity: critical
          service: notification-service
        annotations:
          summary: notification-service database is unavailable
          description: The notification retry scheduler has not been able to reach its database for two minutes.

      - alert: VeloraNotificationRetrySchedulerStalled
        expr: |
          time() - velora_notification_retry_scheduler_last_completion_timestamp_seconds{service="notification-service"} > 60
        labels:
          severity: critical
          service: notification-service
        annotations:
          summary: notification retry scheduler is stalled
          description: The notification retry scheduler has not completed a database query for over sixty seconds.

      - alert: VeloraNotificationApnsTransportFailures
        expr: |
          sum(increase(velora_notification_apns_requests_total{
            service="notification-service",
            outcome=~"timeout|transport_error"
          }[5m])) >= 2
        labels:
          severity: warning
          service: notification-service
        annotations:
          summary: APNs VoIP transport failures are elevated
          description: At least two APNs VoIP timeouts or transport failures occurred during the last five minutes.

  - name: velora-monitoring-service
    rules:
      - alert: VeloraMonitoringServiceDown
        expr: up{job="monitoring-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: monitoring-service
        annotations:
          summary: monitoring-service is unavailable
          description: Prometheus has not been able to scrape monitoring-service for at least one minute.

      - alert: VeloraMonitoringHighRpcErrorRate
        expr: |
          sum(rate(velora_monitoring_rpc_requests_total{status="error"}[5m]))
          /
          clamp_min(sum(rate(velora_monitoring_rpc_requests_total[5m])), 0.000001)
          > 0.05
        for: 5m
        labels:
          severity: warning
          service: monitoring-service
        annotations:
          summary: monitoring-service RPC error rate is above 5 percent
          description: More than 5 percent of monitoring-service RPC/event operations have failed during the last five minutes.

      - alert: VeloraMonitoringHighRpcP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(velora_monitoring_rpc_duration_seconds_bucket[5m])
            )
          ) > 1
        for: 5m
        labels:
          severity: warning
          service: monitoring-service
        annotations:
          summary: monitoring-service p95 RPC latency is above one second
          description: p95 monitoring-service RPC/event latency has remained above one second for five minutes.

      - alert: VeloraMonitoringHighResidentMemory
        expr: velora_process_resident_memory_bytes{service="monitoring-service"} > 536870912
        for: 10m
        labels:
          severity: warning
          service: monitoring-service
        annotations:
          summary: monitoring-service resident memory is above 512 MiB
          description: monitoring-service has used more than 512 MiB of resident memory for ten minutes.

  - name: velora-rag
    rules:
      - alert: VeloraRagHighFailureRate
        expr: |
          (
            sum(rate(velora_rag_requests_total{service="ai-service",outcome="FAILED"}[5m]))
            /
            clamp_min(sum(rate(velora_rag_requests_total{service="ai-service"}[5m])), 0.000001)
          ) > 0.10
          and on()
          sum(increase(velora_rag_requests_total{service="ai-service"}[5m])) >= 10
        for: 5m
        labels:
          severity: warning
          service: ai-service
        annotations:
          summary: RAG failure rate is above 10 percent
          description: More than 10 percent of RAG requests have failed for five minutes with at least ten requests in the rolling window.

      - alert: VeloraRagHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(velora_rag_request_duration_seconds_bucket{service="ai-service"}[5m])
            )
          ) > 20
          and on()
          sum(increase(velora_rag_requests_total{service="ai-service"}[5m])) >= 5
        for: 5m
        labels:
          severity: warning
          service: ai-service
        annotations:
          summary: RAG p95 latency is above 20 seconds
          description: RAG p95 end-to-end latency has remained above 20 seconds for five minutes with at least five recent requests.

  - name: velora-reel-pipeline
    rules:
      - alert: VeloraReelMonitoringSnapshotUnavailable
        expr: velora_reel_pipeline_snapshot_up{service="content-service"} == 0
        for: 2m
        labels:
          severity: critical
          service: content-service
        annotations:
          summary: Reel pipeline monitoring snapshot is unavailable
          description: monitoring-service has been unable to fetch a Reel pipeline snapshot from content-service for two minutes.

      - alert: VeloraReelPipelineStalled
        expr: velora_reel_pipeline_items{service="content-service",state="stalled"} > 0
        for: 2m
        labels:
          severity: warning
          service: content-service
        annotations:
          summary: Reel pipeline has stalled work
          description: At least one queued or processing Reel has not changed for more than ten minutes.

      - alert: VeloraReelPipelineRecentFailures
        expr: velora_reel_pipeline_recent_failures{service="content-service"} > 0
        for: 1m
        labels:
          severity: warning
          service: content-service
        annotations:
          summary: Reel pipeline recorded a recent failure
          description: At least one Reel recorded processingFailedAt during the last fifteen minutes.

      - alert: VeloraReelRabbitMqUnavailable
        expr: up{job="rabbitmq-reels"} == 0
        for: 2m
        labels:
          severity: critical
          service: rabbitmq
        annotations:
          summary: Reel RabbitMQ metrics are unavailable
          description: Prometheus has not been able to scrape the RabbitMQ Reel queue metrics endpoint for two minutes.

      - alert: VeloraReelMediaBacklogWithoutConsumers
        expr: |
          sum(rabbitmq_detailed_queue_messages_ready{queue=~"reel_media_(short|long)_jobs"}) > 0
          and on()
          sum(rabbitmq_detailed_queue_consumers{queue=~"reel_media_(short|long)_jobs"}) == 0
        for: 2m
        labels:
          severity: critical
          service: media-processing-service
        annotations:
          summary: Reel media jobs are queued with no consumers
          description: Primary Reel media queues contain ready work but have no consumers for two minutes.

      - alert: VeloraReelIndexBacklogWithoutConsumers
        expr: |
          sum(rabbitmq_detailed_queue_messages_ready{queue=~"reel_index_(short|long)_jobs"}) > 0
          and on()
          sum(rabbitmq_detailed_queue_consumers{queue=~"reel_index_(short|long)_jobs"}) == 0
        for: 2m
        labels:
          severity: critical
          service: reel-indexing-service
        annotations:
          summary: Reel index jobs are queued with no consumers
          description: Primary Reel index queues contain ready work but have no consumers for two minutes.

      - alert: VeloraReelMediaDlqNotEmpty
        expr: sum(rabbitmq_detailed_queue_messages_ready{queue=~"reel_media_(short|long)_dlq"}) > 0
        for: 1m
        labels:
          severity: critical
          service: media-processing-service
        annotations:
          summary: Reel media dead-letter queue is not empty
          description: At least one Reel media job exhausted queue retry handling and is waiting in a dead-letter queue.

      - alert: VeloraReelIndexDlqNotEmpty
        expr: sum(rabbitmq_detailed_queue_messages_ready{queue=~"reel_index_(short|long)_dlq"}) > 0
        for: 1m
        labels:
          severity: critical
          service: reel-indexing-service
        annotations:
          summary: Reel index dead-letter queue is not empty
          description: At least one Reel index job exhausted queue retry handling and is waiting in a dead-letter queue.

      - alert: VeloraReelWorkerExhaustedRetries
        expr: sum by (pipeline) (increase(velora_reel_worker_exhausted_retries_total[5m])) > 0
        labels:
          severity: warning
          service: reel-pipeline
        annotations:
          summary: Reel worker retries were exhausted
          description: Reel {{ $labels.pipeline }} processing exhausted its retry budget during the last five minutes.

      - alert: VeloraReelWorkerHighFailureRate
        expr: |
          (
            sum by (pipeline) (rate(velora_reel_worker_stage_runs_total{stage="TOTAL_PIPELINE",outcome="FAILED"}[5m]))
            /
            clamp_min(sum by (pipeline) (rate(velora_reel_worker_stage_runs_total{stage="TOTAL_PIPELINE"}[5m])), 0.000001)
          ) > 0.20
          and on(pipeline)
          sum by (pipeline) (increase(velora_reel_worker_stage_runs_total{stage="TOTAL_PIPELINE"}[5m])) >= 5
        for: 5m
        labels:
          severity: warning
          service: reel-pipeline
        annotations:
          summary: Reel worker failure rate is elevated
          description: Reel {{ $labels.pipeline }} processing has stayed above a 20 percent failure rate for five minutes with at least five recent jobs.

      - alert: VeloraReelWorkerHighQueueWait
        expr: |
          histogram_quantile(
            0.95,
            sum by (pipeline, le) (
              rate(velora_reel_worker_stage_duration_seconds_bucket{stage="QUEUE_WAIT"}[5m])
            )
          ) > 120
          and on(pipeline)
          sum by (pipeline) (increase(velora_reel_worker_stage_runs_total{stage="QUEUE_WAIT"}[5m])) >= 5
        for: 5m
        labels:
          severity: warning
          service: reel-pipeline
        annotations:
          summary: Reel queue wait p95 is elevated
          description: Reel {{ $labels.pipeline }} p95 queue wait has stayed above two minutes for five minutes with at least five recent jobs.
