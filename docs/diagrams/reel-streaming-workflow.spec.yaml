  mode: practical
  targets: []
  claim: documented-subset
  notes: []

nodes:
  - id: reel_response
    label: "Load Reel response"
    kind: source
    responsibility: "Receive a Reel whose streamUrl is derived from hlsMasterKey or the media key"
    confidence: direct
    evidence: ["apps/api-gateway/src/content/content.controller.ts:789-840"]
  - id: build_stream_url
    label: "Resolve HLS master URL"
    kind: transformation
    responsibility: "Keep absolute URLs, map .m3u8 keys to CDN, or map a raw media key to sibling master.m3u8"
    confidence: direct
    evidence: ["apps/api-gateway/src/content/content.controller.ts:893-907"]
  - id: hls_origin
    label: "Serve master → variant → segments"
    kind: transformation
    responsibility: "Validated HLS assets produced by the media pipeline are read through the CDN/media origin"
    confidence: direct
    evidence: ["apps/media-processing-service/src/application/use-cases/prepare-reel-media.use-case.ts:287-345", "apps/media-processing-service/src/application/use-cases/validate-reel-stream.use-case.ts:32-84"]
  - id: cache_policy
    label: "Apply network cache policy"
    kind: transformation
    responsibility: "Offline: none; Wi-Fi: current + previous + 2 ahead/500MB; cellular: current + 1 ahead/250MB; expensive: current only/150MB"
    confidence: direct
    evidence: ["Velora-Mobile/src/lib/reelCachePolicy.ts:15-45", "Velora-Mobile/src/lib/reelCachePolicy.ts:78-110"]
  - id: prefetch_plan
    label: "Plan nearby Reel prefetch"
    kind: transformation
    responsibility: "Prioritize current at 0, ahead at offset×10, and previous at 30 according to the network policy"
    confidence: direct
    evidence: ["Velora-Mobile/src/components/reels/ReelsViewer.tsx:138-175"]
  - id: warm_assets
    label: "Warm HLS start"
    kind: transformation
    responsibility: "Prefetch thumbnail, master playlist, first variant, and first two media resources/segments"
    confidence: direct
    evidence: ["Velora-Mobile/src/lib/reel-prefetch.ts:7-8", "Velora-Mobile/src/lib/reel-prefetch.ts:143-184", "Velora-Mobile/src/components/reels/ReelsViewer.tsx:992-995"]
  - id: save_nearby
    label: "Save nearby video?"
    kind: decision
    responsibility: "Run full temporary-offline caching only when focus, online state, preference, and cache policy allow it"
    confidence: direct
    evidence: ["Velora-Mobile/src/components/reels/ReelsViewer.tsx:976-1011"]
  - id: choose_low_variant
    label: "Choose lowest-bandwidth variant"
    kind: transformation
    responsibility: "Fetch the HLS master and select the lowest BANDWIDTH variant for the persistent temporary cache"
    confidence: direct
    evidence: ["Velora-Mobile/src/lib/offlineReelVideoCache.ts:402-462", "Velora-Mobile/src/lib/offlineReelVideoCache.ts:652-658"]
  - id: build_offline_manifest
    label: "Rewrite local HLS manifest"
    kind: transformation
    responsibility: "Rewrite playlist resource references locally and download all required media resources with concurrency four"
    confidence: direct
    evidence: ["Velora-Mobile/src/lib/offlineReelVideoCache.ts:94-97", "Velora-Mobile/src/lib/offlineReelVideoCache.ts:474-490", "Velora-Mobile/src/lib/offlineReelVideoCache.ts:578-603", "Velora-Mobile/src/lib/offlineReelVideoCache.ts:660-669"]
  - id: persist_offline_cache
    label: "Commit offline cache"
    kind: store
    responsibility: "Move temp directory to final cache, persist offline.m3u8 metadata in WatermelonDB, and enforce cache limits"
    confidence: direct
    evidence: ["Velora-Mobile/src/lib/offlineReelVideoCache.ts:86-97", "Velora-Mobile/src/lib/offlineReelVideoCache.ts:674-705", "Velora-Mobile/src/database/reels/reelOfflineStore.ts:14-23", "Velora-Mobile/src/database/reels/reelOfflineStore.ts:97-109"]
  - id: online
    label: "Online?"
    kind: decision
    responsibility: "Choose remote HLS while online or the local cached manifest while offline"
    confidence: direct
    evidence: ["Velora-Mobile/src/hooks/useOfflineReelVideoSource.ts:119-145"]
  - id: remote_hls
    label: "Keep remote HLS source"
    kind: transformation
    responsibility: "Feed playback sets preferOffline=false so completing a background offline cache does not replace the active online HLS source"
    confidence: direct
    evidence: ["Velora-Mobile/src/components/reels/ReelFeedItem.tsx:515-539", "Velora-Mobile/src/hooks/useOfflineReelVideoSource.ts:119-128"]
  - id: cached_offline
    label: "Cached offline manifest?"
    kind: decision
    responsibility: "When offline, use a cached local manifest only if a cache record is available"
    confidence: direct
    evidence: ["Velora-Mobile/src/hooks/useOfflineReelVideoSource.ts:119-145"]
  - id: local_hls
    label: "Play local offline.m3u8"
    kind: transformation
    responsibility: "Use the rewritten local HLS playlist and downloaded resources"
    confidence: direct
    evidence: ["Velora-Mobile/src/lib/offlineReelVideoCache.ts:668-705", "Velora-Mobile/src/hooks/useOfflineReelVideoSource.ts:123-128"]
  - id: unavailable
    label: "Offline video unavailable"
    kind: sink
    responsibility: "Return no playable URI when offline without a cached record"
    confidence: direct
    evidence: ["Velora-Mobile/src/hooks/useOfflineReelVideoSource.ts:123-145"]
  - id: playback_cache
    label: "Apply player cache"
    kind: transformation
    responsibility: "iOS remote HLS uses expo-video-cache proxy on port 9000 with 500MB; other sources use native expo-video caching"
    confidence: direct
    evidence: ["Velora-Mobile/src/lib/reelPlaybackVideoCache.ts:1-24", "Velora-Mobile/src/components/reels/ReelVideo.tsx:177-192"]
  - id: player
    label: "Play with expo-video"
    kind: sink
    responsibility: "Mark .m3u8 as HLS and use 0.35s minimum playback buffer plus 5s preferred forward buffer"
    confidence: direct
    evidence: ["Velora-Mobile/src/components/reels/ReelVideo.tsx:168-192"]

