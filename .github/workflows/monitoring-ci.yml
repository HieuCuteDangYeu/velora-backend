name: Monitoring Config CI

on:
  pull_request:
    branches:
      - master
    paths:
      - '.env.example'
      - 'docker-compose.yml'
      - 'apps/monitoring-service/**'
      - 'apps/api-gateway/src/monitoring/**'
      - 'apps/api-gateway/src/api-gateway.module.ts'
      - 'infra/monitoring/**'
      - 'scripts/deploy/**'
      - 'scripts/ops/check-monitoring-stack.sh'
      - '.github/workflows/monitoring-ci.yml'
  push:
    branches:
      - master
    paths:
      - '.env.example'
      - 'docker-compose.yml'
      - 'apps/monitoring-service/**'
      - 'apps/api-gateway/src/monitoring/**'
      - 'apps/api-gateway/src/api-gateway.module.ts'
      - 'infra/monitoring/**'
      - 'scripts/deploy/**'
      - 'scripts/ops/check-monitoring-stack.sh'
      - '.github/workflows/monitoring-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitoring-config-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-monitoring-config:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate root Compose monitoring services
        shell: bash
        run: |
          set -euo pipefail
          cat > .env <<'EOF'
          RABBITMQ_DEFAULT_USER=ci
          RABBITMQ_DEFAULT_PASS=ci
          RABBITMQ_DEFAULT_VHOST=/
          RABBITMQ_URL=amqp://ci:ci@rabbitmq:5672/
          EOF
          trap 'rm -f -- .env /tmp/velora-compose.json' EXIT

          node scripts/ops/validate-rabbitmq-config.cjs --env-file .env

          COMPOSE_DISABLE_ENV_FILE=1 \
            DOCKERHUB_USERNAME=ci-placeholder \
            RABBITMQ_DEFAULT_USER=ci \
            RABBITMQ_DEFAULT_PASS=ci \
            RABBITMQ_DEFAULT_VHOST=/ \
            RABBITMQ_URL=amqp://ci:ci@rabbitmq:5672/ \
            GRAFANA_ADMIN_PASSWORD=ci-placeholder \
            docker compose config --no-env-resolution --format json > /tmp/velora-compose.json

          jq -e '
            (.services | has("loki")) and
            (.services | has("alloy")) and
            (.services["monitoring-service"].environment.LOKI_URL == "http://loki:3100") and
            (.services["monitoring-service"].environment.PROMETHEUS_URL == "http://prometheus:9090") and
            (.services["monitoring-service"].depends_on.loki.condition == "service_started") and
            (.services.grafana.depends_on.loki.condition == "service_started") and
            (.services.alloy.depends_on.loki.condition == "service_started") and
            (.volumes | has("loki_data")) and
            (.volumes | has("alloy_data"))
          ' /tmp/velora-compose.json >/dev/null

          test ! -e infra/monitoring/docker-compose.monitoring.yml

      - name: Validate deployment scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/deploy/velora-deploy
          bash -n scripts/deploy/velora-deploy-core
          bash -n scripts/deploy/velora-deploy-launcher
          bash -n scripts/deploy/install-velora-deploy-launcher
          bash -n scripts/ops/check-monitoring-stack.sh

          grep -Fq 'homelab-deploy' scripts/deploy/velora-deploy-launcher
          grep -Fq 'git show "$approved_sha:$CONTROLLER_PATH"' scripts/deploy/velora-deploy-launcher
          grep -Fq 'git show "$approved_sha:$CORE_PATH"' scripts/deploy/velora-deploy-launcher

      - name: Validate Prometheus configuration and rules
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/infra/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:latest \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Grafana dashboard JSON
        run: jq -e . infra/monitoring/grafana/dashboards/velora-monitoring.json >/dev/null
