worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format upstream_log '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" upstream=$upstream_addr';
    access_log /var/log/nginx/access.log upstream_log;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Round-robin is Nginx's default upstream load-balancing method.
    upstream api_gateway {
        zone api_gateway 64k;
        server api-gateway:3000 resolve;
    }

    upstream conversation_service {
        zone conversation_service 64k;
        server conversation-service:3005 resolve;
    }

    upstream call_service {
        zone call_service 64k;
        server call-service:3007 resolve;
    }

    upstream payment_service {
        zone payment_service 64k;
        server payment-service:3006 resolve;
    }

    server {
        listen 80;
        server_name _;

        # ChatGateway uses Socket.IO's default /socket.io/ Engine.IO path.
        location ^~ /socket.io/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://conversation_service;
        }

        # CallGateway is in the /call namespace; the client-facing path is
        # /call/socket.io/ while Nest's Engine.IO listener remains /socket.io/.
        location ^~ /call/socket.io/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://call_service/socket.io/;
        }

        # Preserve the Stripe webhook URI and request body for signature verification.
        location = /payments/webhook {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://payment_service;
        }

        location / {
            proxy_http_version 1.1;
            proxy_connect_timeout 2s;
            # A 503 can be an application dependency outage (e.g. Auth RPC),
            # not a failed Gateway instance. Retrying it quarantines every
            # healthy Gateway and turns unrelated requests into "no live upstreams".
            proxy_next_upstream error timeout http_502 http_504;
            proxy_next_upstream_tries 2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://api_gateway;
        }
    }
}
