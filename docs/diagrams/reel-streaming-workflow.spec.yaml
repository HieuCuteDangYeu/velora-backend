question: "How does Velora serve Reel HLS and cache/play it on the mobile application?"
type: flowchart
audience: "Backend and mobile engineers reviewing Reel streaming and cache behavior"
scope: "API HLS URL enrichment, CDN HLS delivery, network-aware mobile prefetch, persistent offline HLS cache, source selection, and player cache behavior"
commit: "backend fd757662; Velora-Mobile 2b044e3 (relevant streaming ranges unchanged by local edits)"
extracted_with:
  - "repository source trace"
  - "Repo Diagrammer evidence IR"

