name: Security scan

# Reports known-vulnerable dependencies (pnpm audit) and vulnerable packages,
# misconfigurations and secrets in the repository and Dockerfiles (Trivy).
# Report only for now: it never blocks the homelab deploy. Read the job summary.
on:
  push:
    branches: [master]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'apps/*/Dockerfile'
      - '.github/workflows/security-scan.yml'
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: pnpm audit (production dependencies, high and critical)
        run: |
          set +e
          pnpm audit --prod --audit-level high > audit.txt 2>&1
          status=$?
          {
            echo '## pnpm audit (prod, high+)'
            echo '```'
            tail -n 60 audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "pnpm audit exit code: $status (report only)"

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (vulnerabilities, secrets, Dockerfile misconfigurations)
        # The official image instead of trivy-action: the action's binary download failed on hosted runners.
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.65.0 fs \
            --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed \
            --skip-dirs node_modules --skip-dirs eval --skip-dirs docs \
            --exit-code 0 --format table --output trivy.txt .
      - name: Summary
        if: always()
        run: |
          {
            echo '## Trivy (HIGH, CRITICAL, fixed versions available)'
            echo '```'
            head -c 60000 trivy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
