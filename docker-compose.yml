services:
  api-gateway:
    image: ${DOCKERHUB_USERNAME}/api-gateway:latest
    build:
      context: .
      dockerfile: ./apps/api-gateway/Dockerfile
    restart: always
    expose:
      - '3000'
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - '127.0.0.1:80:80'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    networks:
      - microservices-net

  user-service:
    image: ${DOCKERHUB_USERNAME}/user-service:latest
    build:
      context: .
      dockerfile: ./apps/user-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  friend-service:
    image: ${DOCKERHUB_USERNAME}/friend-service:latest
    build:
      context: .
      dockerfile: ./apps/friend-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  auth-service:
    image: ${DOCKERHUB_USERNAME}/auth-service:latest
    build:
      context: .
      dockerfile: ./apps/auth-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  media-service:
    image: ${DOCKERHUB_USERNAME}/media-service:latest
    build:
      context: .
      dockerfile: ./apps/media-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  media-processing-service:
    image: ${DOCKERHUB_USERNAME}/media-processing-service:latest
    build:
      context: .
      dockerfile: ./apps/media-processing-service/Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      MEDIA_WORKER_LANE: SHORT
      MEDIA_WORKER_PREFETCH: ${MEDIA_WORKER_PREFETCH:-1}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  media-processing-long-service:
    image: ${DOCKERHUB_USERNAME}/media-processing-service:latest
    restart: always
    env_file:
      - .env
    environment:
      MEDIA_WORKER_LANE: LONG
      MEDIA_WORKER_PREFETCH: ${MEDIA_WORKER_PREFETCH:-1}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  reel-indexing-service:
    image: ${DOCKERHUB_USERNAME}/reel-indexing-service:latest
    build:
      context: .
      dockerfile: ./apps/reel-indexing-service/Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      # The same image serves both lanes; only the lane differs from .env.
      INDEX_WORKER_LANE: SHORT
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  reel-indexing-long-service:
    image: ${DOCKERHUB_USERNAME}/reel-indexing-service:latest
    restart: always
    env_file:
      - .env
    environment:
      # The same image serves both lanes; only the lane differs from .env.
      INDEX_WORKER_LANE: LONG
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  content-service:
    image: ${DOCKERHUB_USERNAME}/content-service:latest
    build:
      context: .
      dockerfile: ./apps/content-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  payment-service:
    image: ${DOCKERHUB_USERNAME}/payment-service:latest
    build:
      context: .
      dockerfile: ./apps/payment-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    expose:
      - '3006'
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  mail-service:
    image: ${DOCKERHUB_USERNAME}/mail-service:latest
    build:
      context: .
      dockerfile: ./apps/mail-service/Dockerfile
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  conversation-service:
    image: ${DOCKERHUB_USERNAME}/conversation-service:latest
    build:
      context: .
      dockerfile: ./apps/conversation-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    expose:
      - '3005'
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  call-service:
    image: ${DOCKERHUB_USERNAME}/call-service:latest
    build:
      context: .
      dockerfile: ./apps/call-service/Dockerfile
    restart: always
    expose:
      - '3007'
    ports:
      - '40000-40100:40000-40100/udp'
    environment:
      NODE_ENV: production
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  monitoring-service:
    image: ${DOCKERHUB_USERNAME}/monitoring-service:latest
    build:
      context: .
      dockerfile: ./apps/monitoring-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    env_file:
      - .env
    environment:
      PROMETHEUS_URL: http://prometheus:9090
    expose:
      - '3016'
    depends_on:
      rabbitmq:
        condition: service_healthy
      prometheus:
        condition: service_started
    networks:
      - microservices-net

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    mem_limit: ${PROMETHEUS_MEMORY_LIMIT:-512m}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - '127.0.0.1:9090:9090'
    depends_on:
      - node-exporter
    networks:
      - microservices-net

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    mem_limit: ${NODE_EXPORTER_MEMORY_LIMIT:-64m}
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/.+)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    expose:
      - '9100'
    networks:
      - microservices-net

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    # Velora uses Grafana only as a lightweight Prometheus dashboard. Keep a
    # little memory headroom while avoiding backend plugins and background
    # services that are not part of the homelab observability path.
    mem_limit: ${GRAFANA_MEMORY_LIMIT:-384m}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Production homelab deployments set this in .env. Keeping interpolation
      # non-fatal lets CI validate the root Compose model without real secrets.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      # Do not install/update the suggested plugin set on every startup.
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: 'false'
      # Grafana 13 bundles many backend datasource plugins as separate
      # processes. Velora only provisions Prometheus, so explicitly prevent the
      # unused plugins/apps from loading and consuming RAM.
      GF_PLUGINS_DISABLE_PLUGINS: >-
        elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,
        influxdb,jaeger,loki,mssql,mysql,opentsdb,stackdriver,tempo,zipkin,
        grafana-metricsdrilldown-app,grafana-advisor-app,grafana-pyroscope-app,
        grafana-exploretraces-app,grafana-lokiexplore-app
      # Prometheus rules are the source of truth for this homelab. Grafana is a
      # read/visualization layer, so its own alert scheduler and Live websocket
      # service are unnecessary here.
      GF_UNIFIED_ALERTING_ENABLED: 'false'
      GF_LIVE_MAX_CONNECTIONS: '0'
      # Avoid periodic outbound update/catalog/usage work on the small host.
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '127.0.0.1:3001:3000'
    depends_on:
      - prometheus
    networks:
      - microservices-net

  notification-service:
    image: ${DOCKERHUB_USERNAME}/notification-service:latest
    build:
      context: .
      dockerfile: ./apps/notification-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    expose:
      - '3015'
    volumes:
      - ./apps/notification-service/secrets/firebase-admin.json:/usr/src/app/apps/notification-service/secrets/firebase-admin.json:ro
      - ./apps/notification-service/secrets/apns-private-key.p8:/usr/src/app/apps/notification-service/secrets/apns-private-key.p8:ro
    networks:
      - microservices-net

  ai-service:
    image: ${DOCKERHUB_USERNAME}/ai-service:latest
    build:
      context: .
      dockerfile: ./apps/ai-service/Dockerfile
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  # Local retrieval-model services are profile-gated during migration so the
  # host can be benchmarked before they become production dependencies.
  rag-embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-latest@sha256:7e0ad922d10ef6f728b521d1a47e83004480687bd4073c97f079c806e3e92a41
    profiles:
      - local-embedding
    command:
      - --model-id
      - BAAI/bge-m3
      - --port
      - '80'
      - --max-concurrent-requests
      - '8'
      - --max-batch-tokens
      - '1024'
    restart: 'no'
    volumes:
      - rag_embedding_cache:/data
    networks:
      - microservices-net

  rag-reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-latest@sha256:7e0ad922d10ef6f728b521d1a47e83004480687bd4073c97f079c806e3e92a41
    profiles:
      - local-reranker
    command:
      - --model-id
      - cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
      - --port
      - '80'
      - --max-concurrent-requests
      - '8'
      - --max-batch-tokens
      - '1024'
    restart: 'no'
    volumes:
      - rag_reranker_cache:/data
    networks:
      - microservices-net

  rag-vision:
    image: ollama/ollama:latest
    profiles:
      - local-vision
    restart: 'no'
    volumes:
      - rag_vision_cache:/root/.ollama
    networks:
      - microservices-net

  rag-eval:
    image: ${DOCKERHUB_USERNAME:-local}/rag-eval:latest
    build:
      context: .
      dockerfile: ./eval/rag/Dockerfile
      args:
        EVALUATOR_SHA: ${EVALUATOR_SHA:-unknown}
        PRODUCTION_SHA: ${PRODUCTION_SHA:-unknown}
    profiles:
      - eval
    restart: 'no'
    env_file:
      - ${RAG_EVAL_ENV_FILE:-./eval/rag/eval.env.example}
    environment:
      # Provider credentials are read from the server-side deployment env at
      # run time; they are never copied into the image or committed.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_AI_GATEWAY_ID: ${CLOUDFLARE_AI_GATEWAY_ID:-}
      AI_ROUTER_MODEL: ${AI_ROUTER_MODEL:-}
      AI_ROUTER_TIMEOUT_MS: ${AI_ROUTER_TIMEOUT_MS:-}
      AI_ROUTER_MAX_TOKENS: ${AI_ROUTER_MAX_TOKENS:-}
      AI_RETRIEVAL_PLANNER_MODEL: ${AI_RETRIEVAL_PLANNER_MODEL:-}
      AI_RETRIEVAL_PLANNER_TIMEOUT_MS: ${AI_RETRIEVAL_PLANNER_TIMEOUT_MS:-}
      AI_RETRIEVAL_PLANNER_MAX_TOKENS: ${AI_RETRIEVAL_PLANNER_MAX_TOKENS:-}
      AI_VERIFIER_MODEL: ${AI_VERIFIER_MODEL:-}
      AI_VERIFIER_TIMEOUT_MS: ${AI_VERIFIER_TIMEOUT_MS:-}
      AI_VERIFIER_MAX_TOKENS: ${AI_VERIFIER_MAX_TOKENS:-}
      AI_CITATION_ATTRIBUTION_MODEL: ${AI_CITATION_ATTRIBUTION_MODEL:-}
      AI_CITATION_TIMEOUT_MS: ${AI_CITATION_TIMEOUT_MS:-}
      AI_CITATION_MAX_TOKENS: ${AI_CITATION_MAX_TOKENS:-}
      CLOUDFLARE_AI_GATEWAY_ENABLED: ${CLOUDFLARE_AI_GATEWAY_ENABLED:-}
      CLOUDFLARE_AI_GATEWAY_MAX_ATTEMPTS: ${CLOUDFLARE_AI_GATEWAY_MAX_ATTEMPTS:-}
      CLOUDFLARE_AI_GATEWAY_RETRY_DELAY_MS: ${CLOUDFLARE_AI_GATEWAY_RETRY_DELAY_MS:-}
      CLOUDFLARE_AI_GATEWAY_BACKOFF: ${CLOUDFLARE_AI_GATEWAY_BACKOFF:-}
      CLOUDFLARE_STRUCTURED_REASONING_EFFORT: ${CLOUDFLARE_STRUCTURED_REASONING_EFFORT:-}
      CLOUDFLARE_ROUTER_OUTPUT_CONTRACT: ${CLOUDFLARE_ROUTER_OUTPUT_CONTRACT:-}
      CLOUDFLARE_STRUCTURED_MAX_TOKENS_PARAMETER: ${CLOUDFLARE_STRUCTURED_MAX_TOKENS_PARAMETER:-}
    volumes:
      - ${RAG_EVAL_RESULTS_DIR:-./eval/rag/results}:/workspace/eval/rag/results
      - ${RAG_EVAL_EXPERIMENTS_DIR:-./eval/rag/experiments}:/workspace/eval/rag/experiments
      - ${RAG_EVAL_AMI_REPORT_DIR:-./test-data/reel-integration/ami/reports}:/workspace/test-data/reel-integration/ami/reports
    networks:
      - microservices-net

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - '127.0.0.1:15672:15672'
      - '127.0.0.1:5672:5672'
    expose:
      - '5672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge

volumes:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  rag_embedding_cache:
  rag_reranker_cache:
  rag_vision_cache:
