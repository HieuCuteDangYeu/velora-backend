groups:
  - name: velora-host
    rules:
      - alert: VeloraHostDown
        expr: up{job="node-exporter"} == 0
        for: 1m
        labels:
          severity: critical
          service: node-exporter
        annotations:
          summary: monitored host exporter is unavailable
          description: Prometheus has not been able to scrape node-exporter for at least one minute.

      - alert: VeloraHostHighCpu
        expr: |
          1 - avg(rate(node_cpu_seconds_total{job="node-exporter",mode="idle"}[5m]))
          > 0.7
        for: 5m
        labels:
          severity: warning
          service: node-exporter
        annotations:
          summary: host CPU usage is above 70 percent
          description: CPU usage across the monitored host has remained above 70 percent for five minutes.

      - alert: VeloraHostHighMemory
        expr: |
          1 - (
            max(node_memory_MemAvailable_bytes{job="node-exporter"})
            / clamp_min(max(node_memory_MemTotal_bytes{job="node-exporter"}), 1)
          ) > 0.75
        for: 5m
        labels:
          severity: warning
          service: node-exporter
        annotations:
          summary: host memory usage is above 75 percent
          description: Host memory usage based on MemAvailable has remained above 75 percent for five minutes.

      - alert: VeloraHostDiskAlmostFull
        expr: |
          1 - (
            max(node_filesystem_avail_bytes{
              job="node-exporter",
              mountpoint=~"^/$|^/opt/orbstack-guest/data$",
              fstype!~"tmpfs|overlay|squashfs"
            })
            / clamp_min(max(node_filesystem_size_bytes{
              job="node-exporter",
              mountpoint=~"^/$|^/opt/orbstack-guest/data$",
              fstype!~"tmpfs|overlay|squashfs"
            }), 1)
          ) > 0.8
        for: 5m
        labels:
          severity: warning
          service: node-exporter
        annotations:
          summary: monitored filesystem is above 80 percent full
          description: Usage of the monitored Docker host filesystem has remained above 80 percent for five minutes.

      - alert: VeloraDeploymentDatabaseGate
        expr: velora_deployment_pending{status="database-gate"} == 1
        for: 0m
        labels:
          severity: critical
          service: deployment
        annotations:
          summary: production deployment requires database approval
          description: The CI-promoted release is blocked until its cloud database change is applied and approved.

      - alert: VeloraDeploymentHealthCheckFailed
        expr: velora_deployment_pending{status="health-check"} == 1
        for: 0m
        labels:
          severity: critical
          service: deployment
        annotations:
          summary: production deployment failed health checks
          description: The CI-promoted release did not become healthy; inspect the deployment receipt and blocked-release state.

      - alert: VeloraDeploymentStalled
        expr: |
          velora_deployment_pending == 1
          and on() (time() - velora_deployment_pending_since_seconds) > 600
        for: 1m
        labels:
          severity: warning
          service: deployment
        annotations:
          summary: production deployment has not reached the promoted release
          description: The CI-promoted release has been pending for more than ten minutes.

      - alert: VeloraConversationServiceDown
        expr: up{job="conversation-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: conversation-service
        annotations:
          summary: conversation-service is unavailable
          description: Prometheus has not been able to scrape conversation-service for at least one minute.

      - alert: VeloraCallServiceDown
        expr: up{job="call-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: call-service
        annotations:
          summary: call-service is unavailable
          description: Prometheus has not been able to scrape call-service for at least one minute.

      - alert: VeloraNotificationServiceDown
        expr: up{job="notification-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: notification-service
        annotations:
          summary: notification-service is unavailable
          description: Prometheus has not been able to scrape notification-service for at least one minute.

  - name: velora-notification-service
    rules:
      - alert: VeloraNotificationServiceRestarting
        expr: |
          changes(velora_process_start_time_seconds{service="notification-service"}[15m]) >= 1
          unless changes(velora_process_start_time_seconds{service="notification-service"}[15m]) >= 3
        labels:
          severity: warning
          service: notification-service
        annotations:
          summary: notification-service restarted
          description: notification-service has restarted one or two times during the last fifteen minutes.

      - alert: VeloraNotificationServiceRestartLoop
        expr: changes(velora_process_start_time_seconds{service="notification-service"}[15m]) >= 3
        labels:
          severity: critical
          service: notification-service
        annotations:
          summary: notification-service restart loop detected
          description: notification-service has restarted at least three times during the last fifteen minutes.

      - alert: VeloraNotificationDatabaseUnavailable
        expr: velora_notification_database_up{service="notification-service"} == 0
        for: 2m
        labels:
          severity: critical
          service: notification-service
        annotations:
          summary: notification-service database is unavailable
          description: The notification retry scheduler has not been able to reach its database for two minutes.

      - alert: VeloraNotificationRetrySchedulerStalled
        expr: |
          time() - velora_notification_retry_scheduler_last_completion_timestamp_seconds{service="notification-service"} > 60
        labels:
          severity: critical
          service: notification-service
        annotations:
          summary: notification retry scheduler is stalled
          description: The notification retry scheduler has not completed a database query for over sixty seconds.

      - alert: VeloraNotificationApnsTransportFailures
        expr: |
          sum(increase(velora_notification_apns_requests_total{
            service="notification-service",
            outcome=~"timeout|transport_error"
          }[5m])) >= 2
        labels:
          severity: warning
          service: notification-service
        annotations:
          summary: APNs VoIP transport failures are elevated
          description: At least two APNs VoIP timeouts or transport failures occurred during the last five minutes.

  - name: velora-monitoring-service
    rules:
      - alert: VeloraMonitoringServiceDown
        expr: up{job="monitoring-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: monitoring-service
        annotations:
          summary: monitoring-service is unavailable
          description: Prometheus has not been able to scrape monitoring-service for at least one minute.

      - alert: VeloraMonitoringHighRpcErrorRate
        expr: |
          sum(rate(velora_monitoring_rpc_requests_total{status="error"}[5m]))
          /
          clamp_min(sum(rate(velora_monitoring_rpc_requests_total[5m])), 0.000001)
          > 0.05
        for: 5m
        labels:
          severity: warning
          service: monitoring-service
        annotations:
          summary: monitoring-service RPC error rate is above 5 percent
          description: More than 5 percent of monitoring-service RPC/event operations have failed during the last five minutes.

      - alert: VeloraMonitoringHighRpcP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(velora_monitoring_rpc_duration_seconds_bucket[5m])
            )
          ) > 1
        for: 5m
        labels:
          severity: warning
          service: monitoring-service
        annotations:
          summary: monitoring-service p95 RPC latency is above one second
          description: p95 monitoring-service RPC/event latency has remained above one second for five minutes.

      - alert: VeloraMonitoringHighResidentMemory
        expr: velora_process_resident_memory_bytes{service="monitoring-service"} > 536870912
        for: 10m
        labels:
          severity: warning
          service: monitoring-service
        annotations:
          summary: monitoring-service resident memory is above 512 MiB
          description: monitoring-service has used more than 512 MiB of resident memory for ten minutes.
